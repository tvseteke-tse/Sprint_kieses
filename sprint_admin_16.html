<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Torna - 16 Fős Admin (WNBA-NBC Stílus)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 12px 20px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); flex-shrink: 0; }
        .header h2 { color: var(--accent); font-size: 1.4rem; }

        /* Fülek (Tabs) stílusa WNBA-NBC mintára */
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-shrink: 0; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .tab-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: 0.2s; }
        .tab-btn:hover { background: #334155; }
        .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

        .content-area { flex-grow: 1; overflow-y: auto; padding-right: 5px; }

        .round-pane { display: none; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 15px; }
        .round-pane.active { display: grid; }

        .match-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .match-header { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; background: #0f172a; padding: 6px 10px; border-radius: 4px; }
        .match-header input { background: #334155; border: 1px solid #475569; color: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; width: 90px; }
        
        .p-row { display: flex; align-items: center; gap: 4px; background: #0f172a; padding: 6px; margin: 4px 0; border-radius: 6px; }
        input[type="text"] { flex: 1; min-width: 100px; background: #334155; border: 1px solid #475569; color: white; padding: 6px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        input[type="number"] { width: 38px; background: #334155; border: 1px solid #475569; color: white; padding: 6px 2px; text-align: center; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        input.sv { border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Sprint Torna Admin - 16 Fő (WNBA-NBC)</h2>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab(0)">1/8 Döntő (First Round)</button>
        <button class="tab-btn" onclick="showTab(1)">Negyeddöntő (Quarterfinals)</button>
        <button class="tab-btn" onclick="showTab(2)">Elődöntő (Semifinals)</button>
        <button class="tab-btn" onclick="showTab(3)">Döntő (Final)</button>
    </div>

    <div class="content-area" id="panes-container"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
            authDomain: "teke-eredmenyek.firebaseapp.com",
            databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
            projectId: "teke-eredmenyek",
            storageBucket: "teke-eredmenyek.firebasestorage.app"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeTabIdx = 0;

        function showTab(idx) {
            activeTabIdx = idx;
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === idx);
            });
            document.querySelectorAll('.round-pane').forEach((pane, i) => {
                pane.classList.toggle('active', i === idx);
            });
        }

        function renderBracket() {
            const container = document.getElementById('panes-container');
            container.innerHTML = '';
            
            const rounds = ['1/8 Döntő', 'Negyeddöntő', 'Elődöntő', 'Döntő'];
            let matchCount = 8;

            rounds.forEach((rName, rIdx) => {
                const paneDiv = document.createElement('div');
                paneDiv.className = `round-pane ${rIdx === 0 ? 'active' : ''}`;
                paneDiv.id = `pane_${rIdx}`;

                for (let i = 0; i < matchCount; i++) {
                    const mId = `r${rIdx}_m${i}`;
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="match-header">
                            <span>Meccs #${i + 1} (SPM${i + 1})</span>
                            <div>
                                Pálya: <input type="text" id="lanes_${mId}" placeholder="1-2" onchange="saveMatch('${mId}')">
                                Idő: <input type="text" id="time_${mId}" placeholder="12:00" onchange="saveMatch('${mId}')">
                            </div>
                        </div>
                        <div class="p-row">
                            <input type="text" id="p1_name_${mId}" placeholder="Játékos 1" onchange="saveMatch('${mId}')">
                            <input type="number" id="p1_s1_${mId}" placeholder="Sz1" title="1. Szett Fa" onchange="saveMatch('${mId}')">
                            <input type="number" id="p1_sv1_${mId}" class="sv" placeholder="SV1" title="Szett 1 SV" onchange="saveMatch('${mId}')">
                            <input type="number" id="p1_s2_${mId}" placeholder="Sz2" title="2. Szett Fa" onchange="saveMatch('${mId}')">
                            <input type="number" id="p1_sv2_${mId}" class="sv" placeholder="SV2" title="Szett 2 SV" onchange="saveMatch('${mId}')">
                            <input type="number" id="p1_msv_${mId}" class="sv" placeholder="MSV" title="Meccs SV" onchange="saveMatch('${mId}')">
                        </div>
                        <div class="p-row">
                            <input type="text" id="p2_name_${mId}" placeholder="Játékos 2" onchange="saveMatch('${mId}')">
                            <input type="number" id="p2_s1_${mId}" placeholder="Sz1" title="1. Szett Fa" onchange="saveMatch('${mId}')">
                            <input type="number" id="p2_sv1_${mId}" class="sv" placeholder="SV1" title="Szett 1 SV" onchange="saveMatch('${mId}')">
                            <input type="number" id="p2_s2_${mId}" placeholder="Sz2" title="2. Szett Fa" onchange="saveMatch('${mId}')">
                            <input type="number" id="p2_sv2_${mId}" class="sv" placeholder="SV2" title="Szett 2 SV" onchange="saveMatch('${mId}')">
                            <input type="number" id="p2_msv_${mId}" class="sv" placeholder="MSV" title="Meccs SV" onchange="saveMatch('${mId}')">
                        </div>
                    `;
                    paneDiv.appendChild(card);
                }
                container.appendChild(paneDiv);
                matchCount /= 2;
            });
        }

        function saveMatch(mId) {
            const data = {
                lanes: document.getElementById(`lanes_${mId}`).value,
                time: document.getElementById(`time_${mId}`).value,
                p1_name: document.getElementById(`p1_name_${mId}`).value,
                p2_name: document.getElementById(`p2_name_${mId}`).value,
                p1_s1: parseInt(document.getElementById(`p1_s1_${mId}`).value) || 0,
                p2_s1: parseInt(document.getElementById(`p2_s1_${mId}`).value) || 0,
                p1_sv1: parseInt(document.getElementById(`p1_sv1_${mId}`).value) || 0,
                p2_sv1: parseInt(document.getElementById(`p2_sv1_${mId}`).value) || 0,
                p1_s2: parseInt(document.getElementById(`p1_s2_${mId}`).value) || 0,
                p2_s2: parseInt(document.getElementById(`p2_s2_${mId}`).value) || 0,
                p1_sv2: parseInt(document.getElementById(`p1_sv2_${mId}`).value) || 0,
                p2_sv2: parseInt(document.getElementById(`p2_sv2_${mId}`).value) || 0,
                p1_msv: parseInt(document.getElementById(`p1_msv_${mId}`).value) || 0,
                p2_msv: parseInt(document.getElementById(`p2_msv_${mId}`).value) || 0,
            };

            db.ref(`torna_16/${mId}`).set(data);
            calcAndAdvance(mId, data);
        }
