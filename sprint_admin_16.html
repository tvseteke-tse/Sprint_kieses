    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 12px 20px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); flex-shrink: 0; }
        .header h2 { color: var(--accent); font-size: 1.4rem; }

        .tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-shrink: 0; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .tab-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .tab-btn:hover { background: #334155; }
        .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

        .content-area { flex-grow: 1; overflow-y: auto; padding-right: 5px; }

        .round-pane { display: none; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 15px; }
        .round-pane.active { display: grid !important; }

        .match-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .match-header { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; background: #0f172a; padding: 6px 10px; border-radius: 4px; }
        .match-header input { background: #334155; border: 1px solid #475569; color: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; width: 70px; }
        .lane-badge { background: #334155; color: var(--accent); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .p-row { display: flex; align-items: center; gap: 4px; background: #0f172a; padding: 6px; margin: 4px 0; border-radius: 6px; }
        input[type="text"] { flex: 1; min-width: 90px; background: #334155; border: 1px solid #475569; color: white; padding: 6px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        input[type="number"] { width: 42px; background: #334155; border: 1px solid #475569; color: white; padding: 6px 2px; text-align: center; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        input.sv { border-color: var(--gold); color: var(--gold); }
    </style>
</head>
