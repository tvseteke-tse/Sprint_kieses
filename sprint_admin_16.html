<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Torna Admin - 16 Fő</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; min-height: 100vh; }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 12px 20px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border); }
        .header h2 { color: var(--accent); font-size: 1.4rem; }

        .tabs { display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .tab-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

        .content-area { flex-grow: 1; }

        .round-pane { display: none; }
        .round-pane.active { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 15px; }

        .match-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .match-header { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; background: #0f172a; padding: 6px 10px; border-radius: 4px; }
        
        .p-row { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 8px; margin: 6px 0; border-radius: 6px; }

        .admin-input {
            background: #334155 !important;
            border: 1px solid #475569 !important;
            color: #ffffff !important;
            padding: 6px !important;
            border-radius: 4px !important;
            font-weight: bold !important;
            font-size: 0.85rem !important;
            display: inline-block !important;
        }

        .input-readonly {
            background: #1e293b !important;
            color: #94a3b8 !important;
            border-color: #334155 !important;
            cursor: not-allowed;
        }

        .input-name { flex: 1; min-width: 110px; }
        .input-num { width: 42px; text-align: center; }
        .input-sv { width: 42px; text-align: center; border-color: var(--gold) !important; color: var(--gold) !important; }
        .input-meta { width: 70px; text-align: center; color: var(--accent) !important; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Sprint Torna Admin - 16 Fő (WNBA-NBC Stílus)</h2>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">1/8 Döntő</button>
        <button class="tab-btn" onclick="switchTab(1)">Negyeddöntő</button>
        <button class="tab-btn" onclick="switchTab(2)">Elődöntő</button>
        <button class="tab-btn" onclick="switchTab(3)">Döntő</button>
    </div>

    <div class="content-area" id="panes-container"></div>

    <script>
        function switchTab(idx) {
            const btns = document.querySelectorAll('.tab-btn');
            const panes = document.querySelectorAll('.round-pane');

            btns.forEach((btn, i) => btn.classList.toggle('active', i === idx));
            panes.forEach((pane, i) => pane.classList.toggle('active', i === idx));
        }

        // A képed szerinti pontos továbbjutási és pálya térkép
        // Forrás matchNum (1-14) -> Cél matchNum (9-15) + Melyik játékos helyre kerül (p1 / p2)
        const progressionMap = {
            1:  { targetMatch: 10, targetPos: 'p1' }, // 1. Gy -> 10. meccs P1
            2:  { targetMatch: 9,  targetPos: 'p1' }, // 2. Gy -> 9. meccs P1
            3:  { targetMatch: 10, targetPos: 'p2' }, // 3. Gy -> 10. meccs P2
            4:  { targetMatch: 9,  targetPos: 'p2' }, // 4. Gy -> 9. meccs P2
            5:  { targetMatch: 12, targetPos: 'p1' }, // 5. Gy -> 12. meccs P1
            6:  { targetMatch: 11, targetPos: 'p1' }, // 6. Gy -> 11. meccs P1
            7:  { targetMatch: 12, targetPos: 'p2' }, // 7. Gy -> 12. meccs P2
            8:  { targetMatch: 11, targetPos: 'p2' }, // 8. Gy -> 11. meccs P2
            9:  { targetMatch: 14, targetPos: 'p1' }, // 9. Gy -> 14. meccs P1
            10: { targetMatch: 13, targetPos: 'p1' }, // 10. Gy -> 13. meccs P1
            11: { targetMatch: 14, targetPos: 'p2' }, // 11. Gy -> 14. meccs P2
            12: { targetMatch: 13, targetPos: 'p2' }, // 12. Gy -> 13. meccs P2
            13: { targetMatch: 15, targetPos: 'p2' }, // 13. Gy -> 15. meccs P2
            14: { targetMatch: 15, targetPos: 'p1' }  // 14. Gy -> 15. meccs P1
        };

        // Alapértelmezett pályák a táblázat alapján
        const defaultLanes = {
            1: '1-2', 2: '3-4', 3: '1-2', 4: '3-4', 5: '1-2', 6: '3-4', 7: '1-2', 8: '3-4',
            9: '1-2', 10: '3-4', 11: '1-2', 12: '3-4',
            13: '1-2', 14: '3-4',
            15: '1-2'
        };

        const r0Times = ['09:00', '09:00', '09:50', '09:50', '10:40', '10:40', '11:30', '11:30'];

        function renderBracket() {
            const container = document.getElementById('panes-container');
            container.innerHTML = '';
            
            const rounds = ['1/8 Döntő', 'Negyeddöntő', 'Elődöntő', 'Döntő'];
            let matchCount = 8;
            let matchNum = 1;

            rounds.forEach((rName, rIdx) => {
                const paneDiv = document.createElement('div');
                paneDiv.className = `round-pane ${rIdx === 0 ? 'active' : ''}`;
                paneDiv.id = `pane_${rIdx}`;

                for (let i = 0; i < matchCount; i++) {
                    const currentMatchNum = matchNum;
                    const mId = `m_${currentMatchNum}`;
                    
                    let laneVal = defaultLanes[currentMatchNum] || '';
                    let timeVal = rIdx === 0 ? r0Times[i] : '';
                    let isReadonly = rIdx === 0 ? 'readonly tabindex="-1"' : '';

                    const laneInputClass = rIdx === 0 ? 'admin-input input-meta input-readonly' : 'admin-input input-meta';
                    const timeInputClass = rIdx === 0 ? 'admin-input input-meta input-readonly' : 'admin-input input-meta';
                    const timeOnChange = rIdx === 0 ? '' : `onchange="saveMatch('${mId}')"`;

                    const cardHtml = `
                        <div class="match-card">
                            <div class="match-header">
                                <span>Meccs #${currentMatchNum}</span>
                                <div>
                                    Pálya: <input type="text" id="lanes_${mId}" class="${laneInputClass}" value="${laneVal}" placeholder="1-2" ${isReadonly}>
                                    Idő: <input type="text" id="time_${mId}" class="${timeInputClass}" value="${timeVal}" placeholder="12:00" ${timeOnChange} ${isReadonly}>
                                </div>
                            </div>
                            <div class="p-row">
                                <input type="text" id="p1_name_${mId}" class="admin-input input-name" placeholder="Játékos 1" onchange="saveMatch('${mId}')">
                                <input type="number" id="p1_s1_${mId}" class="admin-input input-num" placeholder="Sz1" title="1. Szett Fa" onchange="saveMatch('${mId}')">
                                <input type="number" id="p1_sv1_${mId}" class="admin-input input-sv" placeholder="SV1" title="1. Szett SV" onchange="saveMatch('${mId}')">
                                <input type="number" id="p1_s2_${mId}" class="admin-input input-num" placeholder="Sz2" title="2. Szett Fa" onchange="saveMatch('${mId}')">
                                <input type="number" id="p1_sv2_${mId}" class="admin-input input-sv" placeholder="SV2" title="2. Szett SV" onchange="saveMatch('${mId}')">
                                <input type="number" id="p1_msv_${mId}" class="admin-input input-sv" placeholder="MSV" title="Meccs Sudden Victory" onchange="saveMatch('${mId}')">
                            </div>
                            <div class="p-row">
                                <input type="text" id="p2_name_${mId}" class="admin-input input-name" placeholder="Játékos 2" onchange="saveMatch('${mId}')">
                                <input type="number" id="p2_s1_${mId}" class="admin-input input-num" placeholder="Sz1" title="1. Szett Fa" onchange="saveMatch('${mId}')">
                                <input type="number" id="p2_sv1_${mId}" class="admin-input input-sv" placeholder="SV1" title="1. Szett SV" onchange="saveMatch('${mId}')">
                                <input type="number" id="p2_s2_${mId}" class="admin-input input-num" placeholder="Sz2" title="2. Szett Fa" onchange="saveMatch('${mId}')">
                                <input type="number" id="p2_sv2_${mId}" class="admin-input input-sv" placeholder="SV2" title="2. Szett SV" onchange="saveMatch('${mId}')">
                                <input type="number" id="p2_msv_${mId}" class="admin-input input-sv" placeholder="MSV" title="Meccs Sudden Victory" onchange="saveMatch('${mId}')">
                            </div>
                        </div>
                    `;
                    paneDiv.innerHTML += cardHtml;
                    matchNum++;
                }
                container.appendChild(paneDiv);
                matchCount /= 2;
            });
        }

        renderBracket();

        const firebaseConfig = {
            apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
            authDomain: "teke-eredmenyek.firebaseapp.com",
            databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
            projectId: "teke-eredmenyek",
            storageBucket: "teke-eredmenyek.firebasestorage.app"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            listenData();
        } catch(e) {
            console.error("Firebase hiba:", e);
        }

        function saveMatch(mId) {
            if (!db) return;
            const getVal = (id) => document.getElementById(id)?.value || '';
            const getNum = (id) => parseInt(document.getElementById(id)?.value) || 0;

            const data = {
                lanes: getVal(`lanes_${mId}`),
                time: getVal(`time_${mId}`),
                p1_name: getVal(`p1_name_${mId}`),
                p2_name: getVal(`p2_name_${mId}`),
                p1_s1: getNum(`p1_s1_${mId}`),
                p2_s1: getNum(`p2_s1_${mId}`),
                p1_sv1: getNum(`p1_sv1_${mId}`),
                p2_sv1: getNum(`p2_sv1_${mId}`),
                p1_s2: getNum(`p1_s2_${mId}`),
                p2_s2: getNum(`p2_s2_${mId}`),
                p1_sv2: getNum(`p1_sv2_${mId}`),
                p2_sv2: getNum(`p2_sv2_${mId}`),
                p1_msv: getNum(`p1_msv_${mId}`),
                p2_msv: getNum(`p2_msv_${mId}`),
            };

            db.ref(`torna_16/${mId}`).set(data);
            calcAndAdvance(mId, data);
        }

        function calcAndAdvance(mId, d) {
            let p1_s = 0, p2_s = 0;
            if (d.p1_s1 > d.p2_s1) p1_s++; else if (d.p2_s1 > d.p1_s1) p2_s++;
            else if (d.p1_sv1 > d.p2_sv1) p1_s++; else if (d.p2_sv1 > d.p1_sv1) p2_s++;

            if (d.p1_s2 > d.p2_s2) p1_s++; else if (d.p2_s2 > d.p1_s2) p2_s++;
            else if (d.p1_sv2 > d.p2_sv2) p1_s++; else if (d.p2_sv2 > d.p1_sv2) p2_s++;

            let winner = null;
            if (p1_s > p2_s) winner = 1;
            else if (p2_s > p1_s) winner = 2;
            else if (p1_s === 1 && p2_s === 1) {
                if (d.p1_msv > d.p2_msv) winner = 1;
                else if (d.p2_msv > d.p1_msv) winner = 2;
            }

            if (winner) {
                const wName = winner === 1 ? d.p1_name : d.p2_name;
                const matchNum = parseInt(mId.replace('m_', ''));
                const nextStep = progressionMap[matchNum];

                if (nextStep && wName) {
                    const targetId = `m_${nextStep.targetMatch}`;
                    const targetField = `${nextStep.targetPos}_name`;
                    db.ref(`torna_16/${targetId}`).child(targetField).set(wName);
                }
            }
        }

        function listenData() {
            if (!db) return;
            db.ref('torna_16').on('value', snap => {
                const data = snap.val() || {};
                Object.keys(data).forEach(mId => {
                    const m = data[mId];
                    const matchNum = parseInt(mId.replace('m_', ''));
                    
                    const fields = matchNum <= 8 
                        ? ['p1_name','p2_name','p1_s1','p2_s1','p1_sv1','p2_sv1','p1_s2','p2_s2','p1_sv2','p2_sv2','p1_msv','p2_msv']
                        : ['time','lanes','p1_name','p2_name','p1_s1','p2_s1','p1_sv1','p2_sv1','p1_s2','p2_s2','p1_sv2','p2_sv2','p1_msv','p2_msv'];

                    fields.forEach(f => {
                        const el = document.getElementById(`${f}_${mId}`);
                        if (el && document.activeElement !== el) {
                            if (m[f] !== undefined) {
                                el.value = m[f];
                            }
                        }
                    });
                });
            });
        }
    </script>
</body>
</html>
