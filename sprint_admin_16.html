<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Torna - 16 Fős Admin</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; min-height: 100vh; }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 12px 20px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border); }
        .header h2 { color: var(--accent); font-size: 1.4rem; }

        /* Fülek (Tabs) */
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .tab-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

        .content-area { flex-grow: 1; }

        /* Fordulók nézetei */
        .round-pane { display: none; }
        .round-pane.active { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 15px; }

        /* Meccskártya */
        .match-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .match-header { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; background: #0f172a; padding: 6px 10px; border-radius: 4px; }
        
        .p-row { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 8px; margin: 6px 0; border-radius: 6px; }

        /* Adatbeviteli mezők láthatósága */
        .admin-input {
            background: #334155 !important;
            border: 1px solid #475569 !important;
            color: #ffffff !important;
            padding: 6px !important;
            border-radius: 4px !important;
            font-weight: bold !important;
            font-size: 0.85rem !important;
            display: inline-block !important;
        }

        .input-name { flex: 1; min-width: 110px; }
        .input-num { width: 42px; text-align: center; }
        .input-sv { width: 42px; text-align: center; border-color: var(--gold) !important; color: var(--gold) !important; }
        .input-meta { width: 70px; text-align: center; color: var(--accent) !important; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Sprint Torna Admin - 16 Fő (WNBA-NBC Stílus)</h2>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">1/8 Döntő</button>
        <button class="tab-btn" onclick="switchTab(1)">Negyeddöntő</button>
        <button class="tab-btn" onclick="switchTab(2)">Elődöntő</button>
        <button class="tab-btn" onclick="switchTab(3)">Döntő</button>
    </div>

    <div class="content-area" id="panes-container"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
            authDomain: "teke-eredmenyek.firebaseapp.com",
            databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
            projectId: "teke-eredmenyek",
            storageBucket: "teke-eredmenyek.firebasestorage.app"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function switchTab(idx) {
            const btns = document.querySelectorAll('.tab-btn');
            const panes = document.querySelectorAll('.round-pane');

            btns.forEach((btn, i) => btn.classList.toggle('active', i === idx));
            panes.forEach((pane, i) => pane.classList.toggle('active', i === idx));
        }

        function createInput(type, id, placeholder, className, title) {
            const input = document.createElement('input');
            input.type = type;
            input.id = id;
            input.placeholder = placeholder;
            input.className = `admin-input ${className}`;
            if (title) input.title = title;
            return input;
        }

        function renderBracket() {
            const container = document.getElementById('panes-container');
            container.innerHTML = '';
            
            const rounds = ['1/8 Döntő', 'Negyeddöntő', 'Elődöntő', 'Döntő'];
            let matchCount = 8;

            rounds.forEach((rName, rIdx) => {
                const paneDiv = document.createElement('div');
                paneDiv.className = `round-pane ${rIdx === 0 ? 'active' : ''}`;
                paneDiv.id = `pane_${rIdx}`;

                for (let i = 0; i < matchCount; i++) {
                    const mId = `r${rIdx}_m${i}`;
                    const card = document.createElement('div');
                    card.className = 'match-card';

                    // Fejléc (Pálya és Idő)
                    const header = document.createElement('div');
                    header.className = 'match-header';
                    header.innerHTML = `<span>Meccs #${i + 1}</span>`;

                    const metaDiv = document.createElement('div');
                    metaDiv.innerHTML = 'Pálya: ';
                    
                    const laneInp = createInput('text', `lanes_${mId}`, '1-2', 'input-meta');
                    laneInp.onchange = () => saveMatch(mId);
                    metaDiv.appendChild(laneInp);

                    metaDiv.appendChild(document.createTextNode(' Idő: '));
                    const timeInp = createInput('text', `time_${mId}`, '12:00', 'input-meta');
                    timeInp.onchange = () => saveMatch(mId);
                    metaDiv.appendChild(timeInp);

                    header.appendChild(metaDiv);
                    card.appendChild(header);

                    // Játékos 1 sora
                    card.appendChild(createPlayerRow(mId, 1));
                    
                    // Játékos 2 sora
                    card.appendChild(createPlayerRow(mId, 2));

                    paneDiv.appendChild(card);
                }
                container.appendChild(paneDiv);
                matchCount /= 2;
            });
        }

        function createPlayerRow(mId, pNum) {
            const row = document.createElement('div');
            row.className = 'p-row';

            const p = `p${pNum}`;

            const fields = [
                { id: `${p}_name_${mId}`, type: 'text', ph: `Játékos ${pNum}`, cls: 'input-name', title: 'Név' },
                { id: `${p}_s1_${mId}`, type: 'number', ph: 'Sz1', cls: 'input-num', title: '1. Szett Fa' },
                { id: `${p}_sv1_${mId}`, type: 'number', ph: 'SV1', cls: 'input-sv', title: '1. Szett SV' },
                { id: `${p}_s2_${mId}`, type: 'number', ph: 'Sz2', cls: 'input-num', title: '2. Szett Fa' },
                { id: `${p}_sv2_${mId}`, type: 'number', ph: 'SV2', cls: 'input-sv', title: '2. Szett SV' },
                { id: `${p}_msv_${mId}`, type: 'number', ph: 'MSV', cls: 'input-sv', title: 'Meccs Sudden Victory' }
            ];

            fields.forEach(f => {
                const input = createInput(f.type, f.id, f.ph, f.cls, f.title);
                input.onchange = () => saveMatch(mId);
                row.appendChild(input);
            });

            return row;
        }

        function saveMatch(mId) {
            const getVal = (id) => document.getElementById(id)?.value || '';
            const getNum = (id) => parseInt(document.getElementById(id)?.value) || 0;

            const data = {
                lanes: getVal(`lanes_${mId}`),
                time: getVal(`time_${mId}`),
                p1_name: getVal(`p1_name_${mId}`),
                p2_name: getVal(`p2_name_${mId}`),
                p1_s1: getNum(`p1_s1_${mId}`),
                p2_s1: getNum(`p2_s1_${mId}`),
                p1_sv1: getNum(`p1_sv1_${mId}`),
                p2_sv1: getNum(`p2_sv1_${mId}`),
                p1_s2: getNum(`p1_s2_${mId}`),
                p2_s2: getNum(`p2_s2_${mId}`),
                p1_sv2: getNum(`p1_sv2_${mId}`),
                p2_sv2: getNum(`p2_sv2_${mId}`),
                p1_msv: getNum(`p1_msv_${mId}`),
                p2_msv: getNum(`p2_msv_${mId}`),
            };

            db.ref(`torna_16/${mId}`).set(data);
            calcAndAdvance(mId, data);
        }

        function calcAndAdvance(mId, d) {
            let p1_s = 0, p2_s = 0;
            if (d.p1_s1 > d.p2_s1) p1_s++; else if (d.p2_s1 > d.p1_s1) p2_s++;
            else if (d.p1_sv1 > d.p2_sv1) p1_s++; else if (d.p2_sv1 > d.p1_sv1) p2_s++;

            if (d.p1_s2 > d.p2_s2) p1_s++; else if (d.p2_s2 > d.p1_s2) p2_s++;
            else if (d.p1_sv2 > d.p2_sv2) p1_s++; else if (d.p2_sv2 > d.p1_sv2) p2_s++;

            let winner = null;
            if (p1_s > p2_s) winner = 1;
            else if (p2_s > p1_s) winner = 2;
            else if (p1_s === 1 && p2_s === 1) {
                if (d.p1_msv > d.p2_msv) winner = 1;
                else if (d.p2_msv > d.p1_msv) winner = 2;
            }

            if (winner) {
                const wName = winner === 1 ? d.p1_name : d.p2_name;
                const parts = mId.split('_');
                const r = parseInt(parts[0].replace('r','')), m = parseInt(parts[1].replace('m',''));
                const nextId = `r${r+1}_m${Math.floor(m/2)}`;
                const isP1 = (m % 2 === 0);
                
                if (wName && document.getElementById(`p1_name_${nextId}`)) {
                    db.ref(`torna_16/${nextId}`).child(isP1 ? 'p1_name' : 'p2_name').set(wName);
                }
            }
        }

        function listenData() {
            db.ref('torna_16').on('value', snap => {
                const data = snap.val() || {};
                Object.keys(data).forEach(mId => {
                    const m = data[mId];
                    ['lanes','time','p1_name','p2_name','p1_s1','p2_s1','p1_sv1','p2_sv1','p1_s2','p2_s2','p1_sv2','p2_sv2','p1_msv','p2_msv'].forEach(f => {
                        const el = document.getElementById(`${f}_${mId}`);
                        if (el && document.activeElement !== el) {
                            el.value = m[f] !== undefined ? m[f] : '';
                        }
                    });
                });
            });
        }

        // Kirajzolás indítása
        renderBracket();
        listenData();
    </script>
</body>
</html>
