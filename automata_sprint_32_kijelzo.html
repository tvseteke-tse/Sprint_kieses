<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teke Torna Kijelző</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --active-tab: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 2.2rem; color: var(--accent); letter-spacing: 1px; }

    /* Körök / Fülek sávja */
    .tabs-container { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
    .tab-btn {
      background-color: var(--card-bg);
      color: var(--subtext);
      border: 2px solid #334155;
      padding: 10px 22px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover { border-color: var(--accent); color: var(--text); }
    .tab-btn.active { background-color: var(--active-tab); color: #fff; border-color: var(--accent); box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }

    /* Párok / Pályák ráácsa */
    .matches-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; }

    /* Mérkőzés kártya */
    .match-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #334155;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .lane-header { font-size: 0.9rem; font-weight: bold; color: var(--accent); text-transform: uppercase; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 6px; }

    .player-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #334155; }
    .player-row:last-child { border-bottom: none; }

    .player-info { display: flex; flex-direction: column; }
    .player-name { font-size: 1.2rem; font-weight: 600; }
    .player-team { font-size: 0.85rem; color: var(--subtext); }

    .score-box { font-size: 2rem; font-weight: bold; color: #f59e0b; font-family: monospace; }
    
    .no-data { text-align: center; color: var(--subtext); font-style: italic; width: 100%; margin-top: 40px; }
  </style>

  <!-- Firebase v9 SDK SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // FIXME: Cseréld ki a saját Firebase konfigurációdra!
    const firebaseConfig = {
      apiKey: "PÉLDA_API_KEY",
      authDomain: "projekt-id.firebaseapp.com",
      databaseURL: "https://projekt-id-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "projekt-id",
      storageBucket: "projekt-id.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentData = null;
    let selectedRound = "kor_1"; // Alapértelmezett kör

    const tabsContainer = document.getElementById("tabs");
    const matchesGrid = document.getElementById("matchesGrid");

    // Firebase adatok valós idejű figyelése
    const tornaRef = ref(db, 'torna');
    onValue(tornaRef, (snapshot) => {
      currentData = snapshot.val();
      if (currentData) {
        renderTabs();
        renderMatches();
      } else {
        matchesGrid.innerHTML = '<div class="no-data">Nincs elérhető adatsor az adatbázisban.</div>';
      }
    });

    // Fülek (Körök) kirajzolása
    function renderTabs() {
      tabsContainer.innerHTML = '';
      const rounds = Object.keys(currentData);

      if (rounds.length === 0) return;

      // Ha a kiválasztott kör már nem létezik, átállunk az elsőre
      if (!currentData[selectedRound]) {
        selectedRound = rounds[0];
      }

      rounds.forEach((roundKey) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${roundKey === selectedRound ? 'active' : ''}`;
        
        // Formázott név pl. "kor_1" -> "1. KÖR"
        const label = roundKey.replace('kor_', '') + '. KÖR';
        btn.textContent = label;

        btn.onclick = () => {
          selectedRound = roundKey;
          renderTabs();
          renderMatches();
        };

        tabsContainer.appendChild(btn);
      });
    }

    // Pályák / Mérkőzések kirajzolása a kiválasztott körhöz
    function renderMatches() {
      matchesGrid.innerHTML = '';
      const roundData = currentData[selectedRound];

      if (!roundData) {
        matchesGrid.innerHTML = '<div class="no-data">Ebből a körből még nincsenek adatok.</div>';
        return;
      }

      // Végigmegyünk a körhöz tartozó meccseken / pályákon
      Object.keys(roundData).forEach((matchKey, index) => {
        const match = roundData[matchKey];

        const card = document.createElement('div');
        card.className = 'match-card';

        // Csak akkor írjuk ki a nevet, ha tényleg létezik és nem üres string
        const p1Name = (match.player1 && match.player1.name && match.player1.name.trim() !== '') 
          ? match.player1.name 
          : '—';
        const p1Team = match.player1?.team || '';
        const p1Score = match.player1?.score ?? 0;

        const p2Name = (match.player2 && match.player2.name && match.player2.name.trim() !== '') 
          ? match.player2.name 
          : '—';
        const p2Team = match.player2?.team || '';
        const p2Score = match.player2?.score ?? 0;

        card.innerHTML = `
          <div class="lane-header">Pálya / Pár #${index + 1}</div>
          <div class="player-row">
            <div class="player-info">
              <span class="player-name">${escapeHtml(p1Name)}</span>
              ${p1Team ? `<span class="player-team">${escapeHtml(p1Team)}</span>` : ''}
            </div>
            <div class="score-box">${p1Score}</div>
          </div>
          <div class="player-row">
            <div class="player-info">
              <span class="player-name">${escapeHtml(p2Name)}</span>
              ${p2Team ? `<span class="player-team">${escapeHtml(p2Team)}</span>` : ''}
            </div>
            <div class="score-box">${p2Score}</div>
          </div>
        `;

        matchesGrid.appendChild(card);
      });
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</head>
<body>

  <header>
    <h1>VERSENY KIJELZŐ</h1>
  </header>

  <!-- Körök fülei -->
  <div class="tabs-container" id="tabs"></div>

  <!-- Kiválasztott kör eredményei -->
  <div class="matches-grid" id="matchesGrid">
    <div class="no-data">Adatok betöltése...</div>
  </div>

</body>
</html>
