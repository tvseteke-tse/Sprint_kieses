<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Torna Admin - 16 Fő</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --gold: #f59e0b;
            --green: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; min-height: 100vh; }

        #status-bar {
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            background: #334155;
            color: #f8fafc;
        }
        .status-success { background: #15803d !important; color: #fff !important; }
        .status-error { background: #b91c1c !important; color: #fff !important; }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 12px 20px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border); gap: 15px; flex-wrap: wrap; }
        .header-title-input {
            background: transparent;
            border: 1px solid transparent;
            color: var(--accent);
            font-size: 1.4rem;
            font-weight: bold;
            flex: 1;
            min-width: 250px;
            outline: none;
            border-radius: 4px;
            padding: 4px 8px;
        }
        .header-title-input:focus { background: #0f172a; border-color: var(--border); }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-import {
            background: var(--green);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .btn-import:hover { background: #059669; }

        .btn-reset {
            background: var(--danger);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .btn-reset:hover { background: var(--danger-hover); }

        .tabs { display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .tab-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

        .content-area { flex-grow: 1; }
        .round-pane { display: none; }
        .round-pane.active { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 15px; }

        .match-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .match-header { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; background: #0f172a; padding: 6px 10px; border-radius: 4px; }
        
        .p-row { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 8px; margin: 6px 0; border-radius: 6px; }

        .admin-input {
            background: #334155;
            border: 1px solid #475569;
            color: #ffffff;
            padding: 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            display: inline-block;
        }
        .admin-input:focus { border-color: var(--accent); outline: none; }

        .input-readonly { background: #1e293b; color: #94a3b8; border-color: #334155; cursor: not-allowed; }
        .input-disabled { background: #0f172a; color: #475569; border-color: #1e293b; cursor: not-allowed; opacity: 0.4; }

        .input-name { flex: 1; min-width: 110px; }
        .input-num { width: 45px; text-align: center; }
        .input-sv { width: 45px; text-align: center; border-color: var(--gold); color: var(--gold); }
        .input-meta { width: 70px; text-align: center; color: var(--accent); }
    </style>
</head>
<body>

    <div id="status-bar">Firebase kapcsolat ellenőrzése...</div>

    <div class="header">
        <input type="text" id="admin_title" class="header-title-input" value="Sprint Torna Admin - 16 Fő" onchange="saveTitle(this.value)">
        <div class="header-actions">
            <button class="btn-import" onclick="importFromEgyeni16()">Importálás Egyéni 16-ból</button>
            <button class="btn-reset" onclick="resetTournamentData()">⚠️ Adatok törlése az admin felületről</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">Nyolcaddöntő</button>
        <button class="tab-btn" onclick="switchTab(1)">Negyeddöntő</button>
        <button class="tab-btn" onclick="switchTab(2)">Elődöntő</button>
        <button class="tab-btn" onclick="switchTab(3)">Döntő</button>
    </div>

    <div class="content-area" id="panes-container"></div>

    <script>
        function showStatus(msg, isError = false) {
            const sb = document.getElementById('status-bar');
            sb.textContent = msg;
            sb.className = isError ? 'status-error' : 'status-success';
        }

        const firebaseConfig = {
            apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
            authDomain: "teke-eredmenyek.firebaseapp.com",
            databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
            projectId: "teke-eredmenyek",
            storageBucket: "teke-eredmenyek.firebasestorage.app"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            showStatus("Firebase csatlakozva. Adatok betöltése...");
        } catch (e) {
            showStatus("Firebase indítási hiba: " + e.message, true);
        }

        const progressionMap = {
            1:  { targetMatch: 10, targetPos: 'p1' }, 2:  { targetMatch: 9,  targetPos: 'p1' },
            3:  { targetMatch: 10, targetPos: 'p2' }, 4:  { targetMatch: 9,  targetPos: 'p2' },
            5:  { targetMatch: 12, targetPos: 'p1' }, 6:  { targetMatch: 11, targetPos: 'p1' },
            7:  { targetMatch: 12, targetPos: 'p2' }, 8:  { targetMatch: 11, targetPos: 'p2' },
            9:  { targetMatch: 14, targetPos: 'p1' }, 10: { targetMatch: 13, targetPos: 'p1' },
            11: { targetMatch: 14, targetPos: 'p2' }, 12: { targetMatch: 13, targetPos: 'p2' },
            13: { targetMatch: 15, targetPos: 'p2' }, 14: { targetMatch: 15, targetPos: 'p1' }
        };

        const defaultLanes = { 1: '1-2', 2: '3-4', 3: '1-2', 4: '3-4', 5: '1-2', 6: '3-4', 7: '1-2', 8: '3-4', 9: '1-2', 10: '3-4', 11: '1-2', 12: '3-4', 13: '1-2', 14: '3-4', 15: '2-3' };
        const defaultTimes = ['09:00', '09:00', '09:50', '09:50', '10:40', '10:40', '11:30', '11:30'];

        function switchTab(idx) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
            document.querySelectorAll('.round-pane').forEach((pane, i) => pane.classList.toggle('active', i === idx));
        }

        function initDOM() {
            const container = document.getElementById('panes-container');
            container.innerHTML = '';
            
            const rounds = ['Nyolcaddöntő', 'Negyeddöntő', 'Elődöntő', 'Döntő'];
            let matchCount = 8;
            let matchNum = 1;

            rounds.forEach((rName, rIdx) => {
                const paneDiv = document.createElement('div');
                paneDiv.className = `round-pane ${rIdx === 0 ? 'active' : ''}`;
                paneDiv.id = `pane_${rIdx}`;

                for (let i = 0; i < matchCount; i++) {
                    const m = matchNum;
                    const mId = `m_${m}`;

                    const isR1 = (rIdx === 0);
                    const nameAttr = isR1 ? '' : 'readonly class="admin-input input-name input-readonly"';

                    paneDiv.innerHTML += `
                        <div class="match-card">
                            <div class="match-header">
                                <span>Meccs #${m}</span>
                                <div>
                                    Pálya: <input type="text" id="${mId}_lanes" class="admin-input input-meta ${isR1 ? 'input-readonly' : ''}" ${isR1 ? 'readonly' : ''} onchange="updateDB('${mId}', 'lanes', this.value)">
                                    Idő: <input type="text" id="${mId}_time" class="admin-input input-meta ${isR1 ? 'input-readonly' : ''}" ${isR1 ? 'readonly' : ''} onchange="updateDB('${mId}', 'time', this.value)">
                                </div>
                            </div>
                            <div class="p-row">
                                <input type="text" id="${mId}_p1_name" class="admin-input input-name" ${nameAttr} placeholder="Játékos 1" onchange="updateDB('${mId}', 'p1_name', this.value)">
                                <input type="number" id="${mId}_p1_s1" class="admin-input input-num" placeholder="Sz1" onchange="updateDB('${mId}', 'p1_s1', this.value)">
                                <input type="number" id="${mId}_p1_sv1" class="admin-input input-sv input-disabled" disabled placeholder="SV1" onchange="updateDB('${mId}', 'p1_sv1', this.value)">
                                <input type="number" id="${mId}_p1_s2" class="admin-input input-num" placeholder="Sz2" onchange="updateDB('${mId}', 'p1_s2', this.value)">
                                <input type="number" id="${mId}_p1_sv2" class="admin-input input-sv input-disabled" disabled placeholder="SV2" onchange="updateDB('${mId}', 'p1_sv2', this.value)">
                                <input type="number" id="${mId}_p1_msv" class="admin-input input-sv input-disabled" disabled placeholder="MSV" onchange="updateDB('${mId}', 'p1_msv', this.value)">
                            </div>
                            <div class="p-row">
                                <input type="text" id="${mId}_p2_name" class="admin-input input-name" ${nameAttr} placeholder="Játékos 2" onchange="updateDB('${mId}', 'p2_name', this.value)">
                                <input type="number" id="${mId}_p2_s1" class="admin-input input-num" placeholder="Sz1" onchange="updateDB('${mId}', 'p2_s1', this.value)">
                                <input type="number" id="${mId}_p2_sv1" class="admin-input input-sv input-disabled" disabled placeholder="SV1" onchange="updateDB('${mId}', 'p2_sv1', this.value)">
                                <input type="number" id="${mId}_p2_s2" class="admin-input input-num" placeholder="Sz2" onchange="updateDB('${mId}', 'p2_s2', this.value)">
                                <input type="number" id="${mId}_p2_sv2" class="admin-input input-sv input-disabled" disabled placeholder="SV2" onchange="updateDB('${mId}', 'p2_sv2', this.value)">
                                <input type="number" id="${mId}_p2_msv" class="admin-input input-sv input-disabled" disabled placeholder="MSV" onchange="updateDB('${mId}', 'p2_msv', this.value)">
                            </div>
                        </div>
                    `;
                    matchNum++;
                }
                container.appendChild(paneDiv);
                matchCount /= 2;
            });
        }

        // Egyéni 16-ból történő importálás funkció
        function importFromEgyeni16() {
            if (!db) return;
            if (!confirm("Biztosan be szeretnéd importálni az Egyéni 16 versenyzőit? Ez felülírja a Nyolcaddöntő jelenlegi neveit!")) return;

            db.ref('egyeni_16_bowling/players').once('value').then(snapshot => {
                const playersData = snapshot.val();
                if (!playersData) {
                    showStatus("Nem találhatók játékosok az egyeni_16_bowling/players ágon!", true);
                    return;
                }

                let list = Array.isArray(playersData) ? playersData : Object.values(playersData);
                
                let playerNames = list.map(p => {
                    if (typeof p === 'string') return p;
                    return p.name || p.nev || p.player_name || '-';
                }).filter(n => n !== '-');

                if (playerNames.length < 16) {
                    showStatus(`Csak ${playerNames.length} játékos található! A párosításhoz 16 játékosra van szükség.`, true);
                    return;
                }

                const matchups = [
                    { m: 'm_1', p1: 0,  p2: 15 },
                    { m: 'm_2', p1: 7,  p2: 8  },
                    { m: 'm_3', p1: 3,  p2: 12 },
                    { m: 'm_4', p1: 4,  p2: 11 },
                    { m: 'm_5', p1: 1,  p2: 14 },
                    { m: 'm_6', p1: 6,  p2: 9  },
                    { m: 'm_7', p1: 2,  p2: 13 },
                    { m: 'm_8', p1: 5,  p2: 10 }
                ];

                let updates = {};
                matchups.forEach(match => {
                    updates[`torna_16/${match.m}/p1_name`] = playerNames[match.p1];
                    updates[`torna_16/${match.m}/p2_name`] = playerNames[match.p2];
                });

                db.ref().update(updates, (error) => {
                    if (error) {
                        showStatus("Importálási hiba: " + error.message, true);
                    } else {
                        showStatus("Játékosok sikeresen beimportálva az Egyéni 16-ból!");
                    }
                });
            }).catch(err => {
                showStatus("Hiba az adatok lekérésekor: " + err.message, true);
            });
        }

        // Adatok törlése az admin felületről
        function resetTournamentData() {
            if (!db) return;
            const confirm1 = confirm("Biztosan törölni szeretnéd az ÖSSZES beírt eredményt és játékost?");
            if (!confirm1) return;

            const confirm2 = confirm("FIGYELEM: Ez a művelet végleges és azonnal töröl mindent a Firebase-ből! Biztosan folytatod?");
            if (!confirm2) return;

            db.ref('torna_16').remove()
                .then(() => {
                    showStatus("Az adatbázis sikeresen kiürítve!");
                    document.querySelectorAll('input').forEach(input => {
                        if (input.id !== 'admin_title') input.value = '';
                    });
                })
                .catch(error => {
                    showStatus("Hiba történt a törlés során: " + error.message, true);
                });
        }

        function updateDB(mId, key, val) {
            if (!db) return;
            const isNum = key.includes('_s') || key.includes('_sv') || key.includes('_msv');
            let parsedVal = val;
            
            if (isNum) {
                if (val === '') {
                    parsedVal = '';
                } else {
                    parsedVal = parseInt(val, 10);
                    if (key.endsWith('_s1') || key.endsWith('_s2')) {
                        if (parsedVal > 180) {
                            alert("A szett eredménye maximum 180 lehet!");
                            document.getElementById(`${mId}_${key}`).value = '';
                            parsedVal = '';
                        }
                    }
                }
            }

            db.ref(`torna_16/${mId}/${key}`).set(parsedVal, (error) => {
                if (error) showStatus("Mentési Hiba: " + error.message, true);
                else showStatus("Adat sikeresen mentve!");
            });
        }

        function saveTitle(val) {
            if (!db) return;
            db.ref('torna_16/title').set(val, (error) => {
                if (error) showStatus("Cím mentési hiba: " + error.message, true);
                else showStatus("Cím elmentve!");
            });
        }

        function syncUI() {
            if (!db) return;
            db.ref('torna_16').on('value', snap => {
                showStatus("Adatok szinkronizálva (Firebase OK)");
                const data = snap.val() || {};

                const titleEl = document.getElementById('admin_title');
                if (titleEl && document.activeElement !== titleEl) {
                    titleEl.value = data.title !== undefined ? data.title : 'Sprint Torna Admin - 16 Fő';
                }

                for (let m = 1; m <= 15; m++) {
                    const mId = `m_${m}`;
                    const mData = data[mId] || {};

                    const fields = [
                        'p1_name', 'p2_name', 'p1_s1', 'p2_s1', 'p1_sv1', 'p2_sv1',
                        'p1_s2', 'p2_s2', 'p1_sv2', 'p2_sv2', 'p1_msv', 'p2_msv', 'lanes', 'time'
                    ];

                    fields.forEach(f => {
                        const el = document.getElementById(`${mId}_${f}`);
                        if (el && document.activeElement !== el) {
                            let val = mData[f];
                            if (val === undefined || val === null) {
                                if (f === 'lanes') val = defaultLanes[m] || '';
                                else if (f === 'time' && m <= 8) val = defaultTimes[m - 1] || '';
                                else val = '';
                            }
                            el.value = val;
                        }
                    });

                    processMatchRules(mId, mData);
                }
            }, error => {
                showStatus("Olvasási Hiba: " + error.message, true);
            });
        }

        function processMatchRules(mId, d) {
            const getVal = (k) => (d[k] !== undefined && d[k] !== '') ? parseInt(d[k], 10) : null;

            const s1_1 = getVal('p1_s1'), s1_2 = getVal('p2_s1');
            const s2_1 = getVal('p1_s2'), s2_2 = getVal('p2_s2');

            // SV1 aktiválása ha döntetlen az 1. szett
            const sv1Active = (s1_1 !== null && s1_2 !== null && s1_1 === s1_2 && s1_1 > 0);
            toggleInput(`${mId}_p1_sv1`, sv1Active);
            toggleInput(`${mId}_p2_sv1`, sv1Active);

            // SV2 aktiválása ha döntetlen a 2. szett
            const sv2Active = (s2_1 !== null && s2_2 !== null && s2_1 === s2_2 && s2_1 > 0);
            toggleInput(`${mId}_p1_sv2`, sv2Active);
            toggleInput(`${mId}_p2_sv2`, sv2Active);

            // Alap szettpontok
            let p1_sets = 0, p2_sets = 0;

            if (s1_1 !== null && s1_2 !== null) {
                if (s1_1 > s1_2) p1_sets++;
                else if (s1_2 > s1_1) p2_sets++;
                else {
                    const sv1_1 = getVal('p1_sv1') || 0, sv1_2 = getVal('p2_sv1') || 0;
                    if (sv1_1 > sv1_2) p1_sets++;
                    else if (sv1_2 > sv1_1) p2_sets++;
                }
            }

            if (s2_1 !== null && s2_2 !== null) {
                if (s2_1 > s2_2) p1_sets++;
                else if (s2_2 > s2_1) p2_sets++;
                else {
                    const sv2_1 = getVal('p1_sv2') || 0, sv2_2 = getVal('p2_sv2') || 0;
                    if (sv2_1 > sv2_2) p1_sets++;
                    else if (sv2_2 > sv2_1) p2_sets++;
                }
            }

            // MSV aktiválása 1-1 szettállás esetén
            const msvActive = (p1_sets === 1 && p2_sets === 1);
            toggleInput(`${mId}_p1_msv`, msvActive);
            toggleInput(`${mId}_p2_msv`, msvActive);

            // MSV hozzáadása a szettpontokhoz
            if (msvActive) {
                const msv1 = getVal('p1_msv') || 0, msv2 = getVal('p2_msv') || 0;
                if (msv1 > msv2) p1_sets++;
                else if (msv2 > msv1) p2_sets++;
            }

            // Győztes meghatározása és automatikus továbbjuttatása
            let winner = null;
            if (p1_sets > p2_sets) winner = 1;
            else if (p2_sets > p1_sets) winner = 2;

            if (winner) {
                const winnerName = winner === 1 ? d.p1_name : d.p2_name;
                const matchNum = parseInt(mId.replace('m_', ''), 10);
                const nextStep = progressionMap[matchNum];

                if (nextStep && winnerName) {
                    const targetPath = `torna_16/m_${nextStep.targetMatch}/${nextStep.targetPos}_name`;
                    db.ref(targetPath).transaction(currentVal => winnerName);
                }
            }
        }

        function toggleInput(id, enable) {
            const el = document.getElementById(id);
            if (!el) return;
            el.disabled = !enable;
            if (enable) el.classList.remove('input-disabled');
            else el.classList.add('input-disabled');
        }

        initDOM();
        syncUI();
    </script>
</body>
</html>
