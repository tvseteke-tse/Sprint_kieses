<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Torna Admin - 16 Fő</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --gold: #f59e0b;
            --green: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; min-height: 100vh; }

        #status-bar {
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            background: #334155;
            color: #f8fafc;
        }
        .status-success { background: #15803d !important; color: #fff !important; }
        .status-error { background: #b91c1c !important; color: #fff !important; }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 12px 20px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border); gap: 15px; flex-wrap: wrap; }
        .header-title-input {
            background: transparent;
            border: 1px solid transparent;
            color: var(--accent);
            font-size: 1.4rem;
            font-weight: bold;
            flex: 1;
            min-width: 250px;
            outline: none;
            border-radius: 4px;
            padding: 4px 8px;
        }
        .header-title-input:focus { background: #0f172a; border-color: var(--border); }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-import {
            background: var(--green);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .btn-import:hover { background: #059669; }

        .btn-reset {
            background: var(--danger);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .btn-reset:hover { background: var(--danger-hover); }

        .tabs { display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 8px; overflow-x: auto; }
        .tab-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; white-space: nowrap; }
        .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

        .content-area { flex-grow: 1; }
        .round-pane { display: none; }
        .round-pane.active { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 15px; }

        .match-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .match-header { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; background: #0f172a; padding: 6px 10px; border-radius: 4px; }
        
        .p-row { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 8px; margin: 6px 0; border-radius: 6px; }

        .admin-input {
            background: #334155;
            border: 1px solid #475569;
            color: #ffffff;
            padding: 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            display: inline-block;
        }
        .admin-input:focus { border-color: var(--accent); outline: none; }

        .input-readonly { background: #1e293b; color: #94a3b8; border-color: #334155; cursor: not-allowed; }
        .input-disabled { background: #0f172a; color: #475569; border-color: #1e293b; cursor: not-allowed; opacity: 0.4; }

        .input-name { flex: 1; min-width: 110px; }
        .input-num { width: 45px; text-align: center; }
        .input-sv { width: 45px; text-align: center; border-color: var(--gold); color: var(--gold); }
        .input-meta { width: 70px; text-align: center; color: var(--accent); }
    </style>
</head>
<body>

    <div id="status-bar">Firebase kapcsolat ellenőrzése...</div>

    <div class="header">
        <input type="text" id="admin_title" class="header-title-input" value="Sprint Torna Admin - 16 Fő" onchange="saveTitle(this.value)">
        <div class="header-actions">
            <button class="btn-import" onclick="importFromEgyeni()">📥 Beolvasás Egyéniből</button>
            <button class="btn-reset" onclick="resetTournamentData()">⚠️ Adatok törlése</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">Nyolcaddöntő</button>
        <button class="tab-btn" onclick="switchTab(1)">Negyeddöntő</button>
        <button class="tab-btn" onclick="switchTab(2)">Elődöntő</button>
        <button class="tab-btn" onclick="switchTab(3)">Döntő</button>
    </div>

    <div class="content-area" id="panes-container"></div>

    <script>
        function showStatus(msg, isError = false) {
            const sb = document.getElementById('status-bar');
            sb.textContent = msg;
            sb.className = isError ? 'status-error' : 'status-success';
        }

        const firebaseConfig = {
            apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
            authDomain: "teke-eredmenyek.firebaseapp.com",
            databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
            projectId: "teke-eredmenyek",
            storageBucket: "teke-eredmenyek.firebasestorage.app"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            showStatus("Firebase csatlakozva. Adatok betöltése...");
        } catch (e) {
            showStatus("Firebase indítási hiba: " + e.message, true);
        }

        const progressionMap = {
            1:  { targetMatch: 10, targetPos: 'p1' },
            2:  { targetMatch: 9,  targetPos: 'p1' },
            3:  { targetMatch: 10, targetPos: 'p2' },
            4:  { targetMatch: 9,  targetPos: 'p2' },
            5:  { targetMatch: 12, targetPos: 'p1' },
            6:  { targetMatch: 11, targetPos: 'p1' },
            7:  { targetMatch: 12, targetPos: 'p2' },
            8:  { targetMatch: 11, targetPos: 'p2' },
            9:  { targetMatch: 14, targetPos: 'p1' },
            10: { targetMatch: 13, targetPos: 'p1' },
            11: { targetMatch: 14, targetPos: 'p2' },
            12: { targetMatch: 13, targetPos: 'p2' },
            13: { targetMatch: 15, targetPos: 'p2' },
            14: { targetMatch: 15, targetPos: 'p1' }
        };

        const defaultLanes = {
            1: '1-2', 2: '3-4', 3: '1-2', 4: '3-4', 5: '1-2', 6: '3-4', 7: '1-2', 8: '3-4',
            9: '1-2', 10: '3-4', 11: '1-2', 12: '3-4',
            13: '1-2', 14: '3-4',
            15: '2-3'
        };

        const r0Times = ['09:00', '09:00', '09:50', '09:50', '10:40', '10:40', '11:30', '11:30'];

        function switchTab(idx) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
            document.querySelectorAll('.round-pane').forEach((pane, i) => pane.classList.toggle('active', i === idx));
        }

        function initDOM() {
            const container = document.getElementById('panes-container');
            container.innerHTML = '';
            
            const rounds = [
                { name: 'Nyolcaddöntő', count: 8 },
                { name: 'Negyeddöntő', count: 4 },
                { name: 'Elődöntő', count: 2 },
                { name: 'Döntő', count: 1 }
            ];

            let matchNum = 1;

            rounds.forEach((round, rIdx) => {
                const paneDiv = document.createElement('div');
                paneDiv.className = `round-pane ${rIdx === 0 ? 'active' : ''}`;
                paneDiv.id = `pane_${rIdx}`;

                for (let i = 0; i < round.count; i++) {
                    const m = matchNum;
                    const mId = `m_${m}`;

                    const nameAttr = (rIdx === 0) 
                        ? `class="admin-input input-name" onchange="updateDB('${mId}', 'p1_name', this.value)"`
                        : `readonly class="admin-input input-name input-readonly"`;
                    const nameAttr2 = (rIdx === 0) 
                        ? `class="admin-input input-name" onchange="updateDB('${mId}', 'p2_name', this.value)"`
                        : `readonly class="admin-input input-name input-readonly"`;

                    paneDiv.innerHTML += `
                        <div class="match-card">
                            <div class="match-header">
                                <span>Meccs #${m}</span>
                                <div>
                                    Pálya: <input type="text" id="${mId}_lanes" class="admin-input input-meta input-readonly" readonly onchange="updateDB('${mId}', 'lanes', this.value)">
                                    Idő: <input type="text" id="${mId}_time" class="admin-input input-meta input-readonly" readonly>
                                </div>
                            </div>
                            <div class="p-row">
                                <input type="text" id="${mId}_p1_name" ${nameAttr} placeholder="Játékos 1">
                                <input type="number" id="${mId}_p1_s1" class="admin-input input-num" placeholder="Sz1" onchange="updateDB('${mId}', 'p1_s1', this.value)">
                                <input type="number" id="${mId}_p1_sv1" class="admin-input input-sv input-disabled" disabled placeholder="SV1" onchange="updateDB('${mId}', 'p1_sv1', this.value)">
                                <input type="number" id="${mId}_p1_s2" class="admin-input input-num" placeholder="Sz2" onchange="updateDB('${mId}', 'p1_s2', this.value)">
                                <input type="number" id="${mId}_p1_sv2" class="admin-input input-sv input-disabled" disabled placeholder="SV2" onchange="updateDB('${mId}', 'p1_sv2', this.value)">
                                <input type="number" id="${mId}_p1_msv" class="admin-input input-sv input-disabled" disabled placeholder="MSV" onchange="updateDB('${mId}', 'p1_msv', this.value)">
                            </div>
                            <div class="p-row">
                                <input type="text" id="${mId}_p2_name" ${nameAttr2} placeholder="Játékos 2">
                                <input type="number" id="${mId}_p2_s1" class="admin-input input-num" placeholder="Sz1" onchange="updateDB('${mId}', 'p2_s1', this.value)">
                                <input type="number" id="${mId}_p2_sv1" class="admin-input input-sv input-disabled" disabled placeholder="SV1" onchange="updateDB('${mId}', 'p2_sv1', this.value)">
                                <input type="number" id="${mId}_p2_s2" class="admin-input input-num" placeholder="Sz2" onchange="updateDB('${mId}', 'p2_s2', this.value)">
                                <input type="number" id="${mId}_p2_sv2" class="admin-input input-sv input-disabled" disabled placeholder="SV2" onchange="updateDB('${mId}', 'p2_sv2', this.value)">
                                <input type="number" id="${mId}_p2_msv" class="admin-input input-sv input-disabled" disabled placeholder="MSV" onchange="updateDB('${mId}', 'p2_msv', this.value)">
                            </div>
                        </div>
                    `;
                    matchNum++;
                }
                container.appendChild(paneDiv);
            });
        }

        // --- IMPORTÁLÁS A /egyeni_16_bowling CSOMÓPONTBÓL ---
        function importFromEgyeni() {
            if (!db) return;
            
            if (!confirm("Biztosan be akarod tölteni az egyeni_16_bowling adatbázisból a játékosokat?\n\nEz felülírja a jelenlegi nyolcaddöntős neveket!")) {
                return;
            }

            showStatus("Egyéni (egyeni_16_bowling) eredmények lekérdezése...");

            db.ref('egyeni_16_bowling').once('value', snap => {
                const data = snap.val() || {};
                let players = [];

                Object.keys(data).forEach(key => {
                    const p = data[key];
                    if (p && typeof p === 'object' && key !== 'title') {
                        const nev = p.nev || p.name || p.jatekos_nev || p.jatekosegyesulet || '';
                        
                        if (nev && typeof nev === 'string' && nev.trim() !== '' && nev !== 'Játékos neve') {
                            const teli = parseInt(p.teli, 10) || 0;
                            const tarolas = parseInt(p.tarolas, 10) || 0;
                            
                            let osszes = 0;
                            if (p.osszes !== undefined && p.osszes !== '' && p.osszes !== null) {
                                osszes = parseInt(p.osszes, 10) || 0;
                            } else {
                                osszes = teli + tarolas;
                            }
                            
                            players.push({
                                nev: nev.trim(),
                                osszes: osszes,
                                tarolas: tarolas
                            });
                        }
                    }
                });

                if (players.length === 0) {
                    alert("Nem találhatók érvényes versenyzői adatok az 'egyeni_16_bowling' csomópont alatt!");
                    showStatus("Nincs beolvasható adat.", true);
                    return;
                }

                // Rendezés: 1. Összes fa (csökkenő), 2. Tarolás (csökkenő)
                players.sort((a, b) => {
                    if (b.osszes !== a.osszes) return b.osszes - a.osszes;
                    return b.tarolas - a.tarolas;
                });

                // Kiemelési párosítások 16 fős Sprinthez (1-16, 8-9, 5-12, 4-13, 3-14, 6-11, 7-10, 2-15)
                const seedings = [
                    { m: 1, p1: 1,  p2: 16 },
                    { m: 2, p1: 8,  p2: 9  },
                    { m: 3, p1: 5,  p2: 12 },
                    { m: 4, p1: 4,  p2: 13 },
                    { m: 5, p1: 3,  p2: 14 },
                    { m: 6, p1: 6,  p2: 11 },
                    { m: 7, p1: 7,  p2: 10 },
                    { m: 8, p1: 2,  p2: 15 }
                ];

                const updates = {};
                seedings.forEach(pair => {
                    const player1 = players[pair.p1 - 1] ? players[pair.p1 - 1].nev : '';
                    const player2 = players[pair.p2 - 1] ? players[pair.p2 - 1].nev : '';

                    updates[`torna/m_${pair.m}/p1_name`] = player1;
                    updates[`torna/m_${pair.m}/p2_name`] = player2;
                });

                db.ref().update(updates, (error) => {
                    if (error) {
                        showStatus("Importálási hiba: " + error.message, true);
                    } else {
                        showStatus(`Sikeresen beolvasva ${players.length} játékos a Sprint ágba!`);
                    }
                });
            });
        }

        function resetTournamentData() {
            if (!db) return;
            if (!confirm("Biztosan törölni szeretnéd az ÖSSZES beírt eredményt és játékost?")) return;
            if (!confirm("FIGYELEM: Ez a művelet végleges és azonnal töröl mindent a Firebase torna ágáról! Biztosan folytatod?")) return;

            db.ref('torna').remove()
                .then(() => {
                    showStatus("Az adatbázis sikeresen kiürítve!");
                    document.querySelectorAll('input').forEach(input => {
                        if (input.id !== 'admin_title') input.value = '';
                    });
                })
                .catch(error => {
                    showStatus("Hiba történt a törlés során: " + error.message, true);
                });
        }

        function updateDB(mId, key, val) {
            if (!db) return;
            const isNum = key.includes('_s') || key.includes('_sv') || key.includes('_msv');
            let parsedVal = val;
            
            if (isNum) {
                if (val === '') {
                    parsedVal = '';
                } else {
                    parsedVal = parseInt(val, 10);
                    if (key.endsWith('_s1') || key.endsWith('_s2')) {
                        if (parsedVal > 180) {
                            alert("A szett eredménye maximum 180 lehet!");
                            document.getElementById(`${mId}_${key}`).value = '';
                            parsedVal = '';
                        }
                    }
                }
            }

            db.ref(`torna/${mId}/${key}`).set(parsedVal, (error) => {
                if (error) showStatus("Mentési Hiba: " + error.message, true);
                else showStatus("Adat sikeresen mentve!");
            });
        }

        function saveTitle(val) {
            if (!db) return;
            db.ref('torna/title').set(val, (error) => {
                if (error) showStatus("Cím mentési hiba: " + error.message, true);
                else showStatus("Cím elmentve!");
            });
        }

        function syncUI() {
            if (!db) return;
            db.ref('torna').on('value', snap => {
                showStatus("Adatok szinkronizálva (Firebase OK)");
                const data = snap.val() || {};

                const titleEl = document.getElementById('admin_title');
                if (titleEl && document.activeElement !== titleEl) {
                    titleEl.value = data.title !== undefined ? data.title : 'Sprint Torna Admin - 16 Fő';
                }

                for (let m = 1; m <= 15; m++) {
                    const mId = `m_${m}`;
                    const mData = data[mId] || {};

                    const fields = [
                        'p1_name', 'p2_name', 'p1_s1', 'p2_s1', 'p1_sv1', 'p2_sv1',
                        'p1_s2', 'p2_s2', 'p1_sv2', 'p2_sv2', 'p1_msv', 'p2_msv', 'lanes', 'time'
                    ];

                    fields.forEach(f => {
                        const el = document.getElementById(`${mId}_${f}`);
                        if (el && document.activeElement !== el) {
                            let val = mData[f];
                            if (val === undefined || val === null) {
                                if (f === 'lanes') val = defaultLanes[m] || '';
                                else if (f === 'time') {
                                    if (m <= 8) val = r0Times[m - 1] || '';
                                    else val = '';
                                }
                                else val = '';
                            }
                            el.value = val;
                        }
                    });

                    processMatchRules(mId, mData);
                }
            }, error => {
                showStatus("Olvasási Hiba: " + error.message, true);
            });
        }

        function processMatchRules(mId, d) {
            const getVal = (k) => (d[k] !== undefined && d[k] !== '') ? parseInt(d[k], 10) : null;

            const s1_1 = getVal('p1_s1'), s1_2 = getVal('p2_s1');
            const s2_1 = getVal('p1_s2'), s2_2 = getVal('p2_s2');

            const sv1Active = (s1_1 !== null && s1_2 !== null && s1_1 === s1_2 && s1_1 > 0);
            toggleInput(`${mId}_p1_sv1`, sv1Active);
            toggleInput(`${mId}_p2_sv1`, sv1Active);

            const sv2Active = (s2_1 !== null && s2_2 !== null && s2_1 === s2_2 && s2_1 > 0);
            toggleInput(`${mId}_p1_sv2`, sv2Active);
            toggleInput(`${mId}_p2_sv2`, sv2Active);

            let p1_sets = 0, p2_sets = 0;
            let s1Finished = false, s2Finished = false;

            if (s1_1 !== null && s1_2 !== null) {
                if (s1_1 > s1_2) {
                    p1_sets++;
                    s1Finished = true;
                } else if (s1_2 > s1_1) {
                    p2_sets++;
                    s1Finished = true;
                } else {
                    const sv1_1 = getVal('p1_sv1'), sv1_2 = getVal('p2_sv1');
                    if (sv1_1 !== null && sv1_2 !== null && sv1_1 !== sv1_2) {
                        if (sv1_1 > sv1_2) p1_sets++;
                        else p2_sets++;
                        s1Finished = true;
                    }
                }
            }

            if (s2_1 !== null && s2_2 !== null) {
                if (s2_1 > s2_2) {
                    p1_sets++;
                    s2Finished = true;
                } else if (s2_2 > s2_1) {
                    p2_sets++;
                    s2Finished = true;
                } else {
                    const sv2_1 = getVal('p1_sv2'), sv2_2 = getVal('p2_sv2');
                    if (sv2_1 !== null && sv2_2 !== null && sv2_1 !== sv2_2) {
                        if (sv2_1 > sv2_2) p1_sets++;
                        else p2_sets++;
                        s2Finished = true;
                    }
                }
            }

            const msvActive = (s1Finished && s2Finished && p1_sets === 1 && p2_sets === 1);
            toggleInput(`${mId}_p1_msv`, msvActive);
            toggleInput(`${mId}_p2_msv`, msvActive);

            let winner = null;
            let matchFinished = false;

            if (s1Finished && s2Finished) {
                if (p1_sets === 2) {
                    winner = 1;
                    matchFinished = true;
                } else if (p2_sets === 2) {
                    winner = 2;
                    matchFinished = true;
                } else if (msvActive) {
                    const msv1 = getVal('p1_msv'), msv2 = getVal('p2_msv');
                    if (msv1 !== null && msv2 !== null && msv1 !== msv2) {
                        if (msv1 > msv2) winner = 1;
                        else winner = 2;
                        matchFinished = true;
                    }
                }
            }

            const matchNum = parseInt(mId.replace('m_', ''), 10);
            const nextStep = progressionMap[matchNum];

            if (nextStep) {
                const targetPath = `torna/m_${nextStep.targetMatch}/${nextStep.targetPos}_name`;
                
                if (matchFinished && winner) {
                    const winnerName = winner === 1 ? d.p1_name : d.p2_name;
                    if (winnerName) {
                        db.ref(targetPath).transaction(currentVal => winnerName);
                    }
                } else {
                    db.ref(targetPath).transaction(currentVal => '');
                }
            }
        }

        function toggleInput(id, enable) {
            const el = document.getElementById(id);
            if (!el) return;
            el.disabled = !enable;
            if (enable) el.classList.remove('input-disabled');
            else el.classList.add('input-disabled');
        }

        initDOM();
        syncUI();
    </script>
</body>
</html>
