<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Torna Admin - 16 Fő</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        h1 { color: var(--accent); font-size: 1.5rem; }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-save { background: var(--accent); color: #000; }
        .btn-save:hover { background: #0284c7; color: #fff; }

        .btn-reset { background: var(--danger); color: white; }
        .btn-reset:hover { background: var(--danger-hover); }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 15px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 4px;
        }

        .match-header input {
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text);
            padding: 2px 6px;
            border-radius: 4px;
            width: 70px;
            text-align: center;
        }

        .player-row {
            display: grid;
            grid-template-columns: 1fr repeat(5, 32px);
            gap: 4px;
            align-items: center;
            margin-bottom: 6px;
        }

        .player-row input {
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text);
            padding: 4px;
            border-radius: 4px;
            text-align: center;
            font-size: 0.85rem;
        }

        .player-row input[type="text"] { text-align: left; }
        .player-row .msv-input { border-color: #f59e0b; }
        
        .labels {
            display: grid;
            grid-template-columns: 1fr repeat(5, 32px);
            gap: 4px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>16 Fős Sprint Torna - Admin</h1>
        <div class="header-actions">
            <button type="button" class="btn-save" onclick="saveAllMatches()">💾 MENTÉS FIREBASE-BE</button>
            <button type="button" class="btn-reset" onclick="resetTournamentData()">⚠️ ADATOK TÖRLÉSE</button>
        </div>
    </header>

    <div class="matches-grid" id="matchesContainer"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
            authDomain: "teke-eredmenyek.firebaseapp.com",
            databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
            projectId: "teke-eredmenyek",
            storageBucket: "teke-eredmenyek.firebasestorage.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 15 Meccs kártya generálása
        const container = document.getElementById('matchesContainer');
        for (let i = 1; i <= 15; i++) {
            let roundName = i <= 8 ? "Nyolcaddöntő" : (i <= 12 ? "Negyeddöntő" : (i <= 14 ? "Elődöntő" : "Döntő"));
            container.innerHTML += `
                <div class="match-card" id="card_m_${i}">
                    <div class="match-header">
                        <span><strong>#${i}</strong> - ${roundName}</span>
                        <div>
                            Pálya: <input type="text" id="m_${i}_lanes" placeholder="1-2">
                            Idő: <input type="text" id="m_${i}_time" placeholder="10:00">
                        </div>
                    </div>
                    <div class="labels">
                        <span>Játékos</span><span>S1</span><span>SV1</span><span>S2</span><span>SV2</span><span>MSV</span>
                    </div>
                    <div class="player-row">
                        <input type="text" id="m_${i}_p1_name" placeholder="1. Játékos">
                        <input type="number" id="m_${i}_p1_s1">
                        <input type="number" id="m_${i}_p1_sv1">
                        <input type="number" id="m_${i}_p1_s2">
                        <input type="number" id="m_${i}_p1_sv2">
                        <input type="number" id="m_${i}_p1_msv" class="msv-input">
                    </div>
                    <div class="player-row">
                        <input type="text" id="m_${i}_p2_name" placeholder="2. Játékos">
                        <input type="number" id="m_${i}_p2_s1">
                        <input type="number" id="m_${i}_p2_sv1">
                        <input type="number" id="m_${i}_p2_s2">
                        <input type="number" id="m_${i}_p2_sv2">
                        <input type="number" id="m_${i}_p2_msv" class="msv-input">
                    </div>
                </div>
            `;
        }

        // Firebase adatok betöltése az admin felületre
        db.ref('torna_16').on('value', snapshot => {
            const data = snapshot.val() || {};
            for (let i = 1; i <= 15; i++) {
                const m = data[`m_${i}`] || {};
                const fields = ['lanes', 'time', 'p1_name', 'p1_s1', 'p1_sv1', 'p1_s2', 'p1_sv2', 'p1_msv', 'p2_name', 'p2_s1', 'p2_sv1', 'p2_s2', 'p2_sv2', 'p2_msv'];
                fields.forEach(f => {
                    const el = document.getElementById(`m_${i}_${f}`);
                    if (el && document.activeElement !== el) {
                        el.value = m[f] !== undefined ? m[f] : '';
                    }
                });
            }
        });

        // Adatok mentése
        function saveAllMatches() {
            const updateData = {};
            for (let i = 1; i <= 15; i++) {
                const fields = ['lanes', 'time', 'p1_name', 'p1_s1', 'p1_sv1', 'p1_s2', 'p1_sv2', 'p1_msv', 'p2_name', 'p2_s1', 'p2_sv1', 'p2_s2', 'p2_sv2', 'p2_msv'];
                const matchObj = {};
                fields.forEach(f => {
                    matchObj[f] = document.getElementById(`m_${i}_${f}`).value;
                });
                updateData[`m_${i}`] = matchObj;
            }

            db.ref('torna_16').update(updateData)
                .then(() => alert("Eredmények sikeresen elmentve!"))
                .catch(err => alert("Hiba a mentés során: " + err.message));
        }

        // Adatok törlése rákérdezéssel
        function resetTournamentData() {
            const confirm1 = confirm("Biztosan törölni szeretnéd az ÖSSZES beírt eredményt és játékost?");
            if (!confirm1) return;

            const confirm2 = confirm("FIGYELEM: Ez a művelet végleges és nem vonható vissza! Biztosan folytatod?");
            if (!confirm2) return;

            db.ref('torna_16').remove()
                .then(() => {
                    alert("Az adatbázis sikeresen kiürítve!");
                    document.querySelectorAll('input').forEach(input => input.value = '');
                })
                .catch(error => {
                    alert("Hiba történt a törlés során: " + error.message);
                });
        }
    </script>
</body>
</html>
