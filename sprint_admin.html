<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Torna - Adminisztráció</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border); }
        .size-btns button { background: #475569; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        .size-btns button.active { background: var(--accent); color: #0f172a; }

        .bracket { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px; }
        .round { min-width: 380px; display: flex; flex-direction: column; justify-content: space-around; }
        .round-title { text-align: center; color: var(--accent); font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }

        .match-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin: 8px 0; }
        .match-header { font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px; display: flex; justify-content: space-between; }
        
        .p-row { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 6px 10px; margin: 4px 0; border-radius: 6px; }
        input[type="text"] { flex-grow: 1; background: #334155; border: 1px solid #475569; color: white; padding: 6px; border-radius: 4px; font-weight: bold; }
        input[type="number"] { width: 48px; background: #334155; border: 1px solid #475569; color: white; padding: 6px; text-align: center; border-radius: 4px; font-weight: bold; }
        input.sv { border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Sprint Torna Admin</h2>
        <div class="size-btns">
            <button id="b16" class="active" onclick="setSize(16)">16-os Tábla</button>
            <button id="b32" onclick="setSize(32)">32-es Tábla</button>
        </div>
    </div>

    <div class="bracket" id="bracket"></div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentSize = 16;

        function setSize(size) {
            currentSize = size;
            document.getElementById('b16').classList.toggle('active', size === 16);
            document.getElementById('b32').classList.toggle('active', size === 32);
            db.ref('config/size').set(size);
            renderBracket();
            listenData();
        }

        function renderBracket() {
            const container = document.getElementById('bracket');
            container.innerHTML = '';
            
            const rounds = currentSize === 32 ? 
                ['1/16 Döntő', '1/8 Döntő', 'Negyeddöntő', 'Elődöntő', 'Döntő'] : 
                ['1/8 Döntő', 'Negyeddöntő', 'Elődöntő', 'Döntő'];
                
            let matchCount = currentSize / 2;

            rounds.forEach((rName, rIdx) => {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round';
                roundDiv.innerHTML = `<div class="round-title">${rName}</div>`;

                for (let i = 0; i < matchCount; i++) {
                    const mId = `r${rIdx}_m${i}`;
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="match-header"><span>Meccs #${i + 1}</span></div>
                        <div class="p-row">
                            <input type="text" id="p1_name_${mId}" placeholder="Játékos 1" onchange="saveMatch('${mId}')">
                            <input type="number" id="p1_s1_${mId}" placeholder="Sz1" title="1. Szett Fa" onchange="saveMatch('${mId}')">
                            <input type="number" id="p1_sv1_${mId}" class="sv" placeholder="SV1" title="Szett 1 SV" onchange="saveMatch('${mId}')">
                            <input type="number" id="p1_s2_${mId}" placeholder="Sz2" title="2. Szett Fa" onchange="saveMatch('${mId}')">
                            <input type="number" id="p1_sv2_${mId}" class="sv" placeholder="SV2" title="Szett 2 SV" onchange="saveMatch('${mId}')">
                            <input type="number" id="p1_msv_${mId}" class="sv" placeholder="MSV" title="Meccs SV" onchange="saveMatch('${mId}')">
                        </div>
                        <div class="p-row">
                            <input type="text" id="p2_name_${mId}" placeholder="Játékos 2" onchange="saveMatch('${mId}')">
                            <input type="number" id="p2_s1_${mId}" placeholder="Sz1" title="1. Szett Fa" onchange="saveMatch('${mId}')">
                            <input type="number" id="p2_sv1_${mId}" class="sv" placeholder="SV1" title="Szett 1 SV" onchange="saveMatch('${mId}')">
                            <input type="number" id="p2_s2_${mId}" placeholder="Sz2" title="2. Szett Fa" onchange="saveMatch('${mId}')">
                            <input type="number" id="p2_sv2_${mId}" class="sv" placeholder="SV2" title="Szett 2 SV" onchange="saveMatch('${mId}')">
                            <input type="number" id="p2_msv_${mId}" class="sv" placeholder="MSV" title="Meccs SV" onchange="saveMatch('${mId}')">
                        </div>
                    `;
                    roundDiv.appendChild(card);
                }
                container.appendChild(roundDiv);
                matchCount /= 2;
            });
        }

        function saveMatch(mId) {
            const data = {
                p1_name: document.getElementById(`p1_name_${mId}`).value,
                p2_name: document.getElementById(`p2_name_${mId}`).value,
                p1_s1: parseInt(document.getElementById(`p1_s1_${mId}`).value) || 0,
                p2_s1: parseInt(document.getElementById(`p2_s1_${mId}`).value) || 0,
                p1_sv1: parseInt(document.getElementById(`p1_sv1_${mId}`).value) || 0,
                p2_sv1: parseInt(document.getElementById(`p2_sv1_${mId}`).value) || 0,
                p1_s2: parseInt(document.getElementById(`p1_s2_${mId}`).value) || 0,
                p2_s2: parseInt(document.getElementById(`p2_s2_${mId}`).value) || 0,
                p1_sv2: parseInt(document.getElementById(`p1_sv2_${mId}`).value) || 0,
                p2_sv2: parseInt(document.getElementById(`p2_sv2_${mId}`).value) || 0,
                p1_msv: parseInt(document.getElementById(`p1_msv_${mId}`).value) || 0,
                p2_msv: parseInt(document.getElementById(`p2_msv_${mId}`).value) || 0,
            };

            db.ref(`torna_${currentSize}/${mId}`).set(data);
            calcAndAdvance(mId, data);
        }

        function calcAndAdvance(mId, d) {
            let p1_s = 0, p2_s = 0;
            if (d.p1_s1 > d.p2_s1) p1_s++; else if (d.p2_s1 > d.p1_s1) p2_s++;
            else if (d.p1_sv1 > d.p2_sv1) p1_s++; else if (d.p2_sv1 > d.p1_sv1) p2_s++;

            if (d.p1_s2 > d.p2_s2) p1_s++; else if (d.p2_s2 > d.p1_s2) p2_s++;
            else if (d.p1_sv2 > d.p2_sv2) p1_s++; else if (d.p2_sv2 > d.p1_sv2) p2_s++;

            let winner = null;
            if (p1_s > p2_s) winner = 1;
            else if (p2_s > p1_s) winner = 2;
            else if (p1_s === 1 && p2_s === 1) {
                if (d.p1_msv > d.p2_msv) winner = 1;
                else if (d.p2_msv > d.p1_msv) winner = 2;
            }

            if (winner) {
                const wName = winner === 1 ? d.p1_name : d.p2_name;
                const parts = mId.split('_');
                const r = parseInt(parts[0].replace('r','')), m = parseInt(parts[1].replace('m',''));
                const nextId = `r${r+1}_m${Math.floor(m/2)}`;
                const isP1 = (m % 2 === 0);
                
                if (wName && document.getElementById(`p1_name_${nextId}`)) {
                    db.ref(`torna_${currentSize}/${nextId}`).child(isP1 ? 'p1_name' : 'p2_name').set(wName);
                }
            }
        }

        function listenData() {
            db.ref(`torna_${currentSize}`).on('value', snap => {
                const data = snap.val() || {};
                Object.keys(data).forEach(mId => {
                    const m = data[mId];
                    ['p1_name','p2_name','p1_s1','p2_s1','p1_sv1','p2_sv1','p1_s2','p2_s2','p1_sv2','p2_sv2','p1_msv','p2_msv'].forEach(f => {
                        const el = document.getElementById(`${f}_${mId}`);
                        if (el && document.activeElement !== el) el.value = m[f] || '';
                    });
                });
            });
        }

        db.ref('config/size').on('value', snap => {
            const size = snap.val() || 16;
            if (size !== currentSize) setSize(size);
        });

        setSize(16);
    </script>
</body>
</html>
