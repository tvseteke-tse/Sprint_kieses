<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Torna Kijelző - 16 Fő</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --gold: #f59e0b;
            --winner: #10b981;
            --loser: #ef4444;
            --card-bg: #151d2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; min-height: 100vh; display: flex; flex-direction: column; }

        header {
            text-align: center;
            padding: 10px 20px;
            background: var(--panel);
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        header h1 {
            color: var(--accent);
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .bracket-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-grow: 1;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .round-column {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .round-title {
            text-align: center;
            background: var(--panel);
            color: var(--accent);
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .match-list {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 100%;
            gap: 15px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            padding-bottom: 4px;
        }

        .match-meta {
            background: #0f172a;
            padding: 4px 8px;
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            border-bottom: 1px solid var(--border);
        }

        /* Fejléc címkék stílusa */
        .match-labels {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            padding: 4px 10px 2px 10px;
            background: rgba(15, 23, 42, 0.5);
        }

        .label-item {
            width: 28px;
            text-align: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: #64748b;
        }

        .label-item.sv {
            color: var(--gold);
        }

        .label-item.sp {
            color: var(--accent);
        }

        .player-row {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid #1e293b;
            font-size: 0.85rem;
        }

        .player-row:last-child {
            border-bottom: none;
        }

        .player-row.winner {
            background: rgba(16, 185, 129, 0.15);
        }

        .player-name {
            flex-grow: 1;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 6px;
        }

        .player-row.winner .player-name {
            color: var(--winner);
            font-weight: bold;
        }

        .scores-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .score-box {
            width: 28px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Színkódoló osztályok */
        .score-box.win {
            color: var(--winner) !important;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .score-box.loss {
            color: var(--loser) !important;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .score-box.draw {
            color: var(--gold) !important;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .score-box.sp {
            background: var(--accent);
            color: #0f172a !important;
            font-size: 0.85rem;
            border: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="display_title">Sprint Torna - 16 Fő</h1>
    </header>

    <div class="bracket-container">
        <!-- Nyolcaddöntő -->
        <div class="round-column">
            <div class="round-title">Nyolcaddöntő</div>
            <div class="match-list" id="col_r0"></div>
        </div>

        <!-- Negyeddöntő -->
        <div class="round-column">
            <div class="round-title">Negyeddöntő</div>
            <div class="match-list" id="col_r1"></div>
        </div>

        <!-- Elődöntő -->
        <div class="round-column">
            <div class="round-title">Elődöntő</div>
            <div class="match-list" id="col_r2"></div>
        </div>

        <!-- Döntő -->
        <div class="round-column">
            <div class="round-title">Döntő</div>
            <div class="match-list" id="col_r3"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
            authDomain: "teke-eredmenyek.firebaseapp.com",
            databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
            projectId: "teke-eredmenyek",
            storageBucket: "teke-eredmenyek.firebasestorage.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const matchStructure = [
            { roundIdx: 0, matches: [1, 2, 3, 4, 5, 6, 7, 8] },
            { roundIdx: 1, matches: [9, 10, 11, 12] },
            { roundIdx: 2, matches: [13, 14] },
            { roundIdx: 3, matches: [15] }
        ];

        function initBracket() {
            matchStructure.forEach(r => {
                const col = document.getElementById(`col_r${r.roundIdx}`);
                col.innerHTML = '';
                r.matches.forEach(mNum => {
                    col.innerHTML += `
                        <div class="match-card" id="card_m_${mNum}">
                            <div class="match-meta">
                                <span>Meccs #${mNum}</span>
                                <span id="meta_m_${mNum}">-</span>
                            </div>
                            <div class="match-labels">
                                <span class="label-item">1.sz</span>
                                <span class="label-item sv">SV1</span>
                                <span class="label-item">2.sz</span>
                                <span class="label-item sv">SV2</span>
                                <span class="label-item sp">SP</span>
                                <span class="label-item sv">MSV</span>
                            </div>
                            <div class="player-row" id="p1_row_m_${mNum}">
                                <div class="player-name" id="p1_name_m_${mNum}">-</div>
                                <div class="scores-group" id="p1_scores_m_${mNum}"></div>
                            </div>
                            <div class="player-row" id="p2_row_m_${mNum}">
                                <div class="player-name" id="p2_name_m_${mNum}">-</div>
                                <div class="scores-group" id="p2_scores_m_${mNum}"></div>
                            </div>
                        </div>
                    `;
                });
            });
        }

        initBracket();

        function getColorClass(v1, v2) {
            if (v1 > v2) return 'win';
            if (v1 < v2) return 'loss';
            return 'draw';
        }

        db.ref('torna_16').on('value', snap => {
            const data = snap.val() || {};

            // Címsor frissítése
            if (data.title) {
                document.getElementById('display_title').innerText = data.title;
            }

            // Meccsek adatai
            for (let i = 1; i <= 15; i++) {
                const mId = `m_${i}`;
                const m = data[mId] || {};

                // Pálya és Idő infó
                const metaEl = document.getElementById(`meta_${mId}`);
                if (metaEl) {
                    let metaText = [];
                    if (m.lanes) metaText.push(`Pálya: ${m.lanes}`);
                    if (m.time) metaText.push(`${m.time}`);
                    metaEl.innerText = metaText.join(' | ') || '-';
                }

                // Játékos nevek
                const p1Name = m.p1_name || '-';
                const p2Name = m.p2_name || '-';
                document.getElementById(`p1_name_${mId}`).innerText = p1Name;
                document.getElementById(`p2_name_${mId}`).innerText = p2Name;

                // Számítások
                const p1_s1 = parseInt(m.p1_s1) || 0;
                const p2_s1 = parseInt(m.p2_s1) || 0;
                const p1_sv1 = parseInt(m.p1_sv1) || 0;
                const p2_sv1 = parseInt(m.p2_sv1) || 0;

                const p1_s2 = parseInt(m.p1_s2) || 0;
                const p2_s2 = parseInt(m.p2_s2) || 0;
                const p1_sv2 = parseInt(m.p1_sv2) || 0;
                const p2_sv2 = parseInt(m.p2_sv2) || 0;

                const p1_msv = parseInt(m.p1_msv) || 0;
                const p2_msv = parseInt(m.p2_msv) || 0;

                let p1_sp = 0, p2_sp = 0;

                if (m.p1_s1 !== undefined && m.p2_s1 !== undefined && m.p1_s1 !== '' && m.p2_s1 !== '') {
                    if (p1_s1 > p2_s1) p1_sp++;
                    else if (p2_s1 > p1_s1) p2_sp++;
                    else if (p1_sv1 > p2_sv1) p1_sp++;
                    else if (p2_sv1 > p1_sv1) p2_sp++;
                }

                if (m.p1_s2 !== undefined && m.p2_s2 !== undefined && m.p1_s2 !== '' && m.p2_s2 !== '') {
                    if (p1_s2 > p2_s2) p1_sp++;
                    else if (p2_s2 > p1_s2) p2_sp++;
                    else if (p1_sv2 > p2_sv2) p1_sp++;
                    else if (p2_sv2 > p1_sv2) p2_sp++;
                }

                // Győztes meghatározása
                let winner = 0;
                if (p1_sp > p2_sp) winner = 1;
                else if (p2_sp > p1_sp) winner = 2;
                else if (p1_sp === 1 && p2_sp === 1) {
                    if (p1_msv > p2_msv) winner = 1;
                    else if (p2_msv > p1_msv) winner = 2;
                }

                // Kiemelt sorok frissítése
                const p1Row = document.getElementById(`p1_row_${mId}`);
                const p2Row = document.getElementById(`p2_row_${mId}`);
                p1Row.classList.toggle('winner', winner === 1);
                p2Row.classList.toggle('winner', winner === 2);

                // Eredmény dobozok kirajzolása (P1)
                let p1HTML = '';
                p1HTML += `<div class="score-box ${getColorClass(p1_s1, p2_s1)}">${m.p1_s1 !== undefined && m.p1_s1 !== '' ? m.p1_s1 : '-'}</div>`;
                p1HTML += `<div class="score-box ${getColorClass(p1_sv1, p2_sv1)}">${m.p1_sv1 !== undefined && m.p1_sv1 !== '' ? m.p1_sv1 : '-'}</div>`;
                p1HTML += `<div class="score-box ${getColorClass(p1_s2, p2_s2)}">${m.p1_s2 !== undefined && m.p1_s2 !== '' ? m.p1_s2 : '-'}</div>`;
                p1HTML += `<div class="score-box ${getColorClass(p1_sv2, p2_sv2)}">${m.p1_sv2 !== undefined && m.p1_sv2 !== '' ? m.p1_sv2 : '-'}</div>`;
                p1HTML += `<div class="score-box sp">${p1_sp}</div>`;
                p1HTML += `<div class="score-box ${getColorClass(p1_msv, p2_msv)}">${m.p1_msv !== undefined && m.p1_msv !== '' ? m.p1_msv : '-'}</div>`;
                document.getElementById(`p1_scores_${mId}`).innerHTML = p1HTML;

                // Eredmény dobozok kirajzolása (P2)
                let p2HTML = '';
                p2HTML += `<div class="score-box ${getColorClass(p2_s1, p1_s1)}">${m.p2_s1 !== undefined && m.p2_s1 !== '' ? m.p2_s1 : '-'}</div>`;
                p2HTML += `<div class="score-box ${getColorClass(p2_sv1, p1_sv1)}">${m.p2_sv1 !== undefined && m.p2_sv1 !== '' ? m.p2_sv1 : '-'}</div>`;
                p2HTML += `<div class="score-box ${getColorClass(p2_s2, p1_s2)}">${m.p2_s2 !== undefined && m.p2_s2 !== '' ? m.p2_s2 : '-'}</div>`;
                p2HTML += `<div class="score-box ${getColorClass(p2_sv2, p1_sv2)}">${m.p2_sv2 !== undefined && m.p2_sv2 !== '' ? m.p2_sv2 : '-'}</div>`;
                p2HTML += `<div class="score-box sp">${p2_sp}</div>`;
                p2HTML += `<div class="score-box ${getColorClass(p2_msv, p1_msv)}">${m.p2_msv !== undefined && m.p2_msv !== '' ? m.p2_msv : '-'}</div>`;
                document.getElementById(`p2_scores_${mId}`).innerHTML = p2HTML;
            }
        });
    </script>
</body>
</html>
