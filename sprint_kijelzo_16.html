<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Torna - 16 Fős Kijelző</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --winner: #16a34a;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; overflow-x: auto; }

        .title-bar { text-align: center; font-size: 2.2rem; font-weight: 900; color: var(--accent); margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase; }

        .bracket { display: flex; gap: 20px; justify-content: space-between; align-items: stretch; min-width: 1000px; }
        .round { flex: 1; display: flex; flex-direction: column; justify-content: space-around; min-width: 220px; }
        .round-title { text-align: center; color: var(--accent); font-weight: bold; font-size: 1.1rem; margin-bottom: 12px; text-transform: uppercase; }

        .match-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin: 6px 0; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
        
        .p-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 8px 10px; margin: 3px 0; border-radius: 5px; border-left: 4px solid transparent; font-weight: bold; }
        .p-row.winner { border-left-color: var(--winner); background: #14532d; }
        
        .p-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1rem; }
        .p-sets { background: var(--gold); color: #000; font-size: 1rem; padding: 2px 7px; border-radius: 4px; font-weight: 900; }
    </style>
</head>
<body>

    <div class="title-bar">SPRINT EGYÉNI BAJNOKSÁG (16 FŐ)</div>
    <div class="bracket" id="bracket"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
            authDomain: "teke-eredmenyek.firebaseapp.com",
            databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
            projectId: "teke-eredmenyek",
            storageBucket: "teke-eredmenyek.firebasestorage.app"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function renderBracket() {
            const container = document.getElementById('bracket');
            container.innerHTML = '';
            
            const rounds = ['1/8 Döntő', 'Negyeddöntő', 'Elődöntő', 'Döntő'];
            let matchCount = 8;

            rounds.forEach((rName, rIdx) => {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round';
                roundDiv.innerHTML = `<div class="round-title">${rName}</div>`;

                for (let i = 0; i < matchCount; i++) {
                    const mId = `r${rIdx}_m${i}`;
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="p-row" id="p1_row_${mId}">
                            <span class="p-name" id="p1_name_${mId}">-</span>
                            <span class="p-sets" id="p1_sets_${mId}">0</span>
                        </div>
                        <div class="p-row" id="p2_row_${mId}">
                            <span class="p-name" id="p2_name_${mId}">-</span>
                            <span class="p-sets" id="p2_sets_${mId}">0</span>
                        </div>
                    `;
                    roundDiv.appendChild(card);
                }
                container.appendChild(roundDiv);
                matchCount /= 2;
            });
        }

        function calcMatch(d) {
            if (!d) return { p1_s: 0, p2_s: 0, winner: null };

            let p1_s = 0, p2_s = 0;

            if (d.p1_s1 > d.p2_s1) p1_s++; 
            else if (d.p2_s1 > d.p1_s1) p2_s++;
            else if (d.p1_sv1 || d.p2_sv1) {
                if ((d.p1_sv1 || 0) > (d.p2_sv1 || 0)) p1_s++;
                else if ((d.p2_sv1 || 0) > (d.p1_sv1 || 0)) p2_s++;
            }

            if (d.p1_s2 > d.p2_s2) p1_s++; 
            else if (d.p2_s2 > d.p1_s2) p2_s++;
            else if (d.p1_sv2 || d.p2_sv2) {
                if ((d.p1_sv2 || 0) > (d.p2_sv2 || 0)) p1_s++;
                else if ((d.p2_sv2 || 0) > (d.p1_sv2 || 0)) p2_s++;
            }

            let winner = null;
            if (p1_s > p2_s) winner = 1;
            else if (p2_s > p1_s) winner = 2;
            else if (p1_s === 1 && p2_s === 1) {
                if ((d.p1_msv || 0) > (d.p2_msv || 0)) winner = 1;
                else if ((d.p2_msv || 0) > (d.p1_msv || 0)) winner = 2;
            }

            return { p1_s, p2_s, winner };
        }

        function listenData() {
            db.ref('torna_16').on('value', snap => {
                const data = snap.val() || {};
                Object.keys(data).forEach(mId => {
                    const m = data[mId];
                    const res = calcMatch(m);

                    const p1Name = document.getElementById(`p1_name_${mId}`);
                    const p2Name = document.getElementById(`p2_name_${mId}`);
                    if (p1Name) p1Name.innerText = m.p1_name || '-';
                    if (p2Name) p2Name.innerText = m.p2_name || '-';

                    const p1Sets = document.getElementById(`p1_sets_${mId}`);
                    const p2Sets = document.getElementById(`p2_sets_${mId}`);
                    if (p1Sets) p1Sets.innerText = res.p1_s;
                    if (p2Sets) p2Sets.innerText = res.p2_s;

                    const r1 = document.getElementById(`p1_row_${mId}`);
                    const r2 = document.getElementById(`p2_row_${mId}`);
                    if (r1) r1.classList.toggle('winner', res.winner === 1);
                    if (r2) r2.classList.toggle('winner', res.winner === 2);
                });
            });
        }

        renderBracket();
        listenData();
    </script>
</body>
</html>
