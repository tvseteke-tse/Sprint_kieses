<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automata Sprint Admin - 32 Fő (Egyesülettel)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            --save-btn: #10b981;
            --auto-bg: #1e1b4b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; }

        .header-panel {
            background: var(--panel);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-panel input {
            background: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 1rem;
            flex: 1;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 15px;
        }

        .match-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-title {
            font-weight: bold;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .meta-inputs {
            display: flex;
            gap: 8px;
        }

        .meta-inputs input {
            background: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            width: 50%;
        }

        .player-box {
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .p-row-top {
            display: flex;
            gap: 6px;
        }

        .p-name-input {
            flex: 1.2;
            background: #1e293b;
            border: 1px solid var(--border);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .p-club-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .p-scores-row {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .p-scores-row input {
            width: 45px;
            background: #1e293b;
            border: 1px solid var(--border);
            color: #fff;
            text-align: center;
            padding: 4px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .p-scores-row input.sv { color: #fbbf24; }
        .p-scores-row input.msv { color: #ef4444; font-weight: bold; }

        .p-scores-row label {
            font-size: 0.7rem;
            color: #9ca3af;
            margin-right: 2px;
        }

        .btn-save {
            background: var(--save-btn);
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
            transition: opacity 0.2s;
        }

        .btn-save:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="header-panel">
        <label>Torna Címe:</label>
        <input type="text" id="tournament_title" placeholder="Sprint Torna - 32 Fő">
        <button class="btn-save" onclick="saveTitle()" style="width: auto; padding: 8px 20px;">Cím Mentése</button>
    </div>

    <div class="matches-grid" id="matches_container"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
            authDomain: "teke-eredmenyek.firebaseapp.com",
            databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
            projectId: "teke-eredmenyek",
            storageBucket: "teke-eredmenyek.firebasestorage.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function renderAdminForm() {
            const container = document.getElementById('matches_container');
            container.innerHTML = '';

            for (let m = 1; m <= 31; m++) {
                const mId = `m_${m}`;
                const autoP1 = m > 16 ? ` (M${Math.floor((m-17)*2)+1} Győztese)` : '';
                const autoP2 = m > 16 ? ` (M${Math.floor((m-17)*2)+2} Győztese)` : '';

                container.innerHTML += `
                    <div class="match-card" id="card_${mId}">
                        <div class="match-title">
                            <span>Mérkőzés #${m}</span>
                        </div>
                        
                        <div class="meta-inputs">
                            <input type="text" id="${mId}_lanes" placeholder="Pályák (pl. 1-2)">
                            <input type="text" id="${mId}_time" placeholder="Időpont (pl. 10:00)">
                        </div>

                        <!-- Játékos 1 -->
                        <div class="player-box">
                            <div class="p-row-top">
                                <input type="text" class="p-name-input" id="${mId}_p1_name" placeholder="Játékos 1${autoP1}">
                                <input type="text" class="p-club-input" id="${mId}_p1_club" placeholder="Egyesület / Klub">
                            </div>
                            <div class="p-scores-row">
                                <label>S1:</label><input type="number" id="${mId}_p1_s1">
                                <label>SV1:</label><input type="number" class="sv" id="${mId}_p1_sv1">
                                <label>S2:</label><input type="number" id="${mId}_p1_s2">
                                <label>SV2:</label><input type="number" class="sv" id="${mId}_p1_sv2">
                                <label>MSV:</label><input type="number" class="msv" id="${mId}_p1_msv">
                            </div>
                        </div>

                        <!-- Játékos 2 -->
                        <div class="player-box">
                            <div class="p-row-top">
                                <input type="text" class="p-name-input" id="${mId}_p2_name" placeholder="Játékos 2${autoP2}">
                                <input type="text" class="p-club-input" id="${mId}_p2_club" placeholder="Egyesület / Klub">
                            </div>
                            <div class="p-scores-row">
                                <label>S1:</label><input type="number" id="${mId}_p2_s1">
                                <label>SV1:</label><input type="number" class="sv" id="${mId}_p2_sv1">
                                <label>S2:</label><input type="number" id="${mId}_p2_s2">
                                <label>SV2:</label><input type="number" class="sv" id="${mId}_p2_sv2">
                                <label>MSV:</label><input type="number" class="msv" id="${mId}_p2_msv">
                            </div>
                        </div>

                        <button class="btn-save" onclick="saveMatch(${m})">Mérkőzés Mentése</button>
                    </div>
                `;
            }
        }

        function loadData() {
            db.ref('torna_32').on('value', snap => {
                const data = snap.val() || {};
                
                if (data.title) {
                    document.getElementById('tournament_title').value = data.title;
                }

                for (let m = 1; m <= 31; m++) {
                    const mId = `m_${m}`;
                    const d = data[mId] || {};

                    const fields = ['lanes', 'time', 'p1_name', 'p1_club', 'p1_s1', 'p1_sv1', 'p1_s2', 'p1_sv2', 'p1_msv',
                                    'p2_name', 'p2_club', 'p2_s1', 'p2_sv1', 'p2_s2', 'p2_sv2', 'p2_msv'];

                    fields.forEach(f => {
                        const el = document.getElementById(`${mId}_${f}`);
                        if (el && document.activeElement !== el) {
                            el.value = d[f] !== undefined ? d[f] : '';
                        }
                    });
                }
            });
        }

        function saveMatch(m) {
            const mId = `m_${m}`;
            const fields = ['lanes', 'time', 'p1_name', 'p1_club', 'p1_s1', 'p1_sv1', 'p1_s2', 'p1_sv2', 'p1_msv',
                            'p2_name', 'p2_club', 'p2_s1', 'p2_sv1', 'p2_s2', 'p2_sv2', 'p2_msv'];

            const matchData = {};
            fields.forEach(f => {
                const val = document.getElementById(`${mId}_${f}`).value;
                if (val !== '') {
                    matchData[f] = isNaN(val) || f.includes('name') || f.includes('club') || f === 'lanes' || f === 'time' ? val : parseInt(val, 10);
                } else {
                    matchData[f] = '';
                }
            });

            db.ref(`torna_32/${mId}`).update(matchData)
                .then(() => alert(`Mérkőzés #${m} sikeresen mentve!`))
                .catch(err => alert(`Hiba: ${err.message}`));
        }

        function saveTitle() {
            const title = document.getElementById('tournament_title').value;
            db.ref('torna_32/title').set(title)
                .then(() => alert('Torna címe mentve!'))
                .catch(err => alert(`Hiba: ${err.message}`));
        }

        renderAdminForm();
        loadData();
    </script>
</body>
</html>
